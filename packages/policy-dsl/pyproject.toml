[project]
name = "policy-dsl"
version = "0.1.0"
description = "WP1 — Policy DSL: authored constraints -> signed, indexed policy bundle"
requires-python = ">=3.11"
dependencies = [
    "vlaguard-common",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "shapely>=2.0",
]

[project.scripts]
policy-dsl = "policy_dsl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_dsl"]
