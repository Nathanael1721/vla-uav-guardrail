[project]
name = "safety-shield"
version = "0.1.0"
description = "WP3 — Safety Shield (pure core): monitor -> repair -> escalate"
requires-python = ">=3.11"
dependencies = [
    "vlaguard-common",
    "policy-dsl",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safety_shield"]
