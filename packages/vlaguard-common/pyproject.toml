[project]
name = "vlaguard-common"
version = "0.1.0"
description = "Shared contracts for the Constrained VLA / ArduPilot guardrail stack"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlaguard_common"]
