# CI smoke pipeline.
#
# Grant, Stress Testing, Outputs: "CI smoke pipeline - GitHub Actions or
# similar", and Test scheduling: the smoke profile runs "per build (CI)".
# Until 2026-10-06 this repository had no .github directory at all (audit card
# WP4-06): every test ran when somebody remembered to run it.
#
# WHAT RUNS
#
#   1. Standalone test files that run in full on a clean checkout. Each is its
#      own runner (`python tests/test_x.py` prints "N/M passed" and exits
#      non-zero on a failure); there is no pytest dependency. A test that
#      cannot run on the host prints SKIP and is counted apart, never as a
#      pass (tests/test_api.py's route tests need FastAPI, installed on the
#      3.11 job with signing only; they SKIP on the other two).
#      tests/test_replay.py is NOT listed: its fixtures live under demo/out/
#      (gitignored), so on a clean clone it runs 2 of its 20 tests and SKIPs
#      18, and a green tick there would be mostly silence (measured on a
#      simulated clean clone, 2026-10-06). tests/test_kpi_report.py is not
#      listed for the same reason (its delivered-run checks need demo/out/).
#      tests/test_harness_service.py (the stress harness's gRPC control plane,
#      about 20 s) runs in full on the 3.10 job and the 3.11 job with
#      cryptography, which install pyproject's `harness` extra pinned to the
#      versions the committed stubs were generated with, plus grpcio-tools
#      so its stale-stub check runs (without grpcio-tools that one test
#      SKIPs). On the requirements-only job its logic tests, which drive
#      Harness directly, run and the gRPC / mTLS tests SKIP visibly.
#      Since 2026-10-13 the loop also runs the wave-A files (test_shieldcore_*,
#      test_railinputs_*, test_wp4outputs_*, test_flight_pas_ap_20261008 on its
#      tests/fixtures/ copy of the 8 Oct flight, test_env_pins), each checked
#      first in a clean `git archive` copy with and without the optional extras.
#      tests/test_harnesstruth_*.py (2026-10-12) hold the harness to the
#      grant's forecast, the closed-loop wind model, the RTL hand-over, the
#      self-contained bundles and this file. tests/test_env_pins.py is not
#      listed: its setup_sitl.sh tests build throwaway git repositories with
#      a bash it probes for, and it has not been run on a Linux runner yet.
#   2. The smoke profile of the stress harness (experiments/profiles/smoke.yaml,
#      ~50 scenarios x 1 seed, with the escalation FSM flying, since
#      2026-10-07). Known failures and tracked episodes are reported and do
#      not fail the job; a new failure, a pinned defect that starts passing, a
#      refused run (exit 2) or a run that scored nothing (exit 3) does. The
#      run writes its KPI report (one row per template and parameter cell) to
#      ci-smoke/episodes/kpi_report.md, kept with the bundles.
#
# ON GITHUB SINCE 2026-10-08; GREEN SINCE 4418ae0 (2026-10-12). Every push
# from 8 Oct to 12 Oct failed before the smoke step ran: SpeedClamp logged
# "repairs" of float-rounding excesses on Windows and not on Linux, so pinned
# repair counts held on the desktop and failed here, and a 5 ms timing bound
# was asserted on shared runners (CHANGELOG, 2026-10-12 later). Linux floating
# point can still move a cell that sits on a gate (closest approach 1.003 m
# against the 1 m ring in high-speed-near-edge): if one flips, re-measure it,
# never loosen the gate.
#
# THE SMOKE STEP SINCE 2026-10-12 flies the grant's forecast (5 s at 0.1 s,
# 50 poses per tick, where it flew 3 s at 0.5 s, 6 poses), the closed-loop
# wind model and three more cells (52 -> 55), so it costs more: measured on
# the desktop (one process) at 32.8 s before and 89.9 s after (104 s on
# 2026-10-13, after the review's re-cut, with the desktop shared). On GitHub
# at 4418ae0 the step took 20-29 s, so about 55-80 s is to be expected there
# (scaled, not measured). The standalone-test step grows too: on the desktop
# tests/test_sweep.py took 85 s at 4418ae0 and 228 s on 2026-10-13 (its
# episodes fly the 5 s forecast), and the five test_harnesstruth_* files add
# 65 s, about 3.5 minutes per job in all; on GitHub, where that step took
# 2:36-3:54 at 4418ae0, roughly 5-8 minutes is to be expected (scaled, not
# measured). Both fit the 30-minute timeout. The requirements are pinned
# (shapely, numpy by interpreter) since the same day. The nightly profile is
# defined in .github/workflows/nightly.yml, not here, and has not run: GitHub
# schedules only the default branch's workflows, which is `main` on GitHub,
# while this file, nightly.yml and every push are on `master` (that file's
# header).
#
# WHAT DOES NOT RUN HERE, AND WHY
#
#   Tests that need flight artefacts under demo/out/ (gitignored, ~3 GB), the
#   simulators, WSL, ROS 2, ArduPilot SITL or a GPU. Most of those report SKIP
#   on a clean clone rather than PASS; they are run on the lab machine. The
#   smoke profile here is the headless backend: functional evidence, never
#   KPI-grade (its manifests say `headless-kinematic`).
#
# The three jobs are the interpreters the project actually uses: 3.10 (the
# OpenVLA flight environment imports guardrail from source), 3.11 (the grant's
# floor, pyproject's requires-python), and 3.11 WITHOUT `cryptography`, which
# is the vla-drone environment - optional imports must keep holding there.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  guardrail:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The quotes around protobuf>=7.35.1 matter: `extras` is pasted into
          # a bash line, where a bare `>` would redirect pip's output.
          - python: "3.10"
            extras: "cryptography grpcio==1.84.0 'protobuf>=7.35.1' grpcio-tools==1.84.0"
          - python: "3.11"
            extras: "cryptography fastapi httpx grpcio==1.84.0 'protobuf>=7.35.1' grpcio-tools==1.84.0"
          - python: "3.11"
            extras: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # requirements.txt carries jinja2 since 2026-10-06 (guardrail/compiler.py
      # build_prompt() and summary_pack() render through it), so it is no
      # longer named here by hand. FastAPI and httpx (TestClient) go only to the
      # job that runs tests/test_api.py's route tests: pyproject's `api` extra.
      # grpcio and protobuf (pyproject's `harness` extra) and grpcio-tools go
      # to the two jobs with cryptography, for tests/test_harness_service.py.
      - name: Install the guardrail's dependencies
        run: python -m pip install -r requirements.txt ${{ matrix.extras }}

      - name: Standalone test files
        run: |
          fail=0
          for t in \
              tests/test_scenario_spec.py \
              tests/test_sweep.py \
              tests/test_shield.py \
              tests/test_shield_events.py \
              tests/test_ir.py \
              tests/test_api.py \
              tests/test_corridor.py \
              tests/test_clearance.py \
              tests/test_check_contract.py \
              tests/test_guardrail_coverage.py \
              tests/test_kpi_magnitudes.py \
              tests/test_manifest.py \
              tests/test_bundle.py \
              tests/test_frame_contract.py \
              tests/test_harness_service.py \
              tests/test_harnesstruth_forecast.py \
              tests/test_harnesstruth_rtl.py \
              tests/test_harnesstruth_wind.py \
              tests/test_harnesstruth_bundles.py \
              tests/test_harnesstruth_ci.py \
              tests/test_env_pins.py \
              tests/test_flight_pas_ap_20261008.py \
              tests/test_shieldcore_repair.py \
              tests/test_shieldcore_audit.py \
              tests/test_shieldcore_identity.py \
              tests/test_railinputs_fence_export.py \
              tests/test_railinputs_clock.py \
              tests/test_railinputs_policy.py \
              tests/test_railinputs_manifest.py \
              tests/test_railinputs_node.py \
              tests/test_railinputs_hotapply.py \
              tests/test_railinputs_perception.py \
              tests/test_wp4outputs_kpi_report.py \
              tests/test_wp4outputs_exporters.py \
              tests/test_wp4outputs_harness.py; do
            echo "::group::$t"
            if ! python "$t"; then
              echo "::error file=$t::$t failed"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Smoke profile (stress harness, headless)
        run: >
          python experiments/sweep_scenarios.py --profile smoke
          --out ci-smoke/sweep.json --runs ci-smoke/episodes

      - name: Keep the smoke results, episode bundles and KPI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-py${{ matrix.python }}${{ matrix.extras == '' && '-nosigning' || '' }}
          path: ci-smoke/
          if-no-files-found: warn
