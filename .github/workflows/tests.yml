#          where it matters. The same for 2 of test_follow_dataset's 37 (the
#          training mosaic and its mirror, 2026-10-23); its test of the
#          flight's own JPEG encoder needs OpenCV too, so it SKIPs in that
#          step as well and runs on the lab machine only (37/37 there in
#          vla-real). And for 2 of test_vla_prev_front_rate's 24 (the
#          prev_front mosaic and its mirror, the evaluation tool's prev_front
#          requests through the server's core, 2026-10-24); its training
#          loop on a CPU stand-in needs torch, so it SKIPs in that step too
#          (24/24 in vla-real). The same for 1 of test_vla_speed_words' 17
#          (the evaluation of a speed-words dataset through the server's
#          mosaic and prompt, 2026-10-24); its training loop needs torch and
#          SKIPs in that step too (17/17 in vla-real).
#        - Opt-in wall clock: test_hold_transit's
#          test_each_charge_bounds_what_its_call_costs (the hold-point
#          search's charges against what each call costs on the machine)
#          SKIPs unless GUARDRAIL_TIMING_TESTS=1, on every job: the timing
#          test it replaced failed 1 of 40 runs with eight copies in
#          parallel on the desktop (final review of T1c, 2026-10-21), and
#          the runners are shared. Its deterministic half,
#          test_the_budget_charges_what_the_search_makes, runs everywhere.
#        - node: test_tracker_serve's page check (the Dashboard's dashHeader
#          and liveHTML run under node with the real UI strings: a dead
#          server never reads as current data, a failed live read never as
#          "nothing is running"; review of 8035d0a, P3) SKIPs, visibly,
#          where node is absent (WSL); GitHub's ubuntu runners carry node.
#
#      Each file under NOT LISTED FAILs or ERRORs on a clean copy (or passes
#      without running what it is for), measured 2026-10-19 in all three WSL
#      venvs and again on real 3.10.22 / 3.11.17; the same names, and each
#      reason's count and package, are the EXCLUDED dict of
#      tests/test_harnesstruth_ci.py.
#
#      NOT LISTED, on purpose:
#        test_capture_pairing.py: 5 of its 8 tests ERROR, because
#          demo/semantic_demo.py's capture path imports OpenCV (cv2), which
#          no job installs.
#        test_city_traffic.py: 1 of its 34 tests FAILs (the update stagger):
#          the fake world's pose calls are reached only after
#          demo/moving_car.py imports projectairsim, the simulator's client,
#          which no job installs.
#        test_deck_scorer_parity.py: 7 of its 13 tests need flight logs
#          under demo/out/ (SKIP), and its JavaScript-against-Python
#          comparisons return early, counted as passes, where node is
#          absent: WSL has no node, so they have never run on Linux.
#        test_policy_hud.py: 6 of its 45 tests ERROR without Pillow (the
#          overlay drawing), which no job installs for the loop; since
#          2026-11-04 it runs in the Pillow step below.
#        test_hud_fits.py: 8 of its 12 tests ERROR without Pillow (the
#          panels drawn on blank frames, 2026-11-04); it runs in the Pillow
#          step below.
#        test_range_and_lock.py: 16 of its 112 tests ERROR without OpenCV.
#        test_two_view.py: 6 of its 9 tests ERROR without OpenCV and Pillow.
#      END OF THE EXCLUSIONS
#
#      test_env_pins' setup_sitl.sh tests build throwaway git repositories
#      with a bash they probe for; their first GitHub run failed on a lost
#      executable bit and was fixed (CHANGELOG, 2026-10-13 later).
#   1b. On the 3.10 job only, the step "AerialVLA image tests (Pillow)" runs
#      test_aerialvla_codec and test_vla_server once more with Pillow
#      installed for that step alone, so their image tests run instead of
#      SKIPping (since 2026-10-22, review of V1a, P9; WHAT SKIPS above).
#   2. tools/check_claims.py, the withdrawn-claim scan, over its default
#      scope (README, docs, the site sources, the root guides, tools and the
#      code packages), as its own step since 2026-10-19: a live withdrawn
#      claim or a missing corrected value fails it. Exit 0 on a clean copy,
#      with one visible SKIP-LOCAL line for each of its 4 gitignored lab-only
#      documents (272/272 files clean in all three WSL venvs).
#      tests/test_check_claims.py, in the loop, checks the scan itself.
#   3. The smoke profile of the stress harness (experiments/profiles/smoke.yaml,
#      ~50 scenarios x 1 seed, with the escalation FSM flying, since
#      2026-10-07). Known failures and tracked episodes are reported and do
#      not fail the job; a new failure, a pinned defect that starts passing, a
#      refused run (exit 2), a run that scored nothing (exit 3) or a run whose
#      KPI rollup or top-10 failure list could not be computed (exit 4, since
#      2026-10-19: a failed rollup writes no partial KPI report, and a failed
#      top-10 list heads the report as INCOMPLETE) does. The run writes its
#      KPI report (one row per template and parameter cell) to
#      ci-smoke/episodes/kpi_report.md, kept with the bundles.
#
# ON GITHUB SINCE 2026-10-08; GREEN SINCE 4418ae0 (2026-10-12). Every push
# from 8 Oct to 12 Oct failed before the smoke step ran: SpeedClamp logged
# "repairs" of float-rounding excesses on Windows and not on Linux, so pinned
# repair counts held on the desktop and failed here, and a 5 ms timing bound
# was asserted on shared runners (CHANGELOG, 2026-10-12 later). Linux floating
# point can still move a cell that sits on a gate (closest approach 1.003 m
# against the 1 m ring in high-speed-near-edge): if one flips, re-measure it,
# never loosen the gate.
#
# THE SMOKE STEP SINCE 2026-10-12 flies the grant's forecast (5 s at 0.1 s,
# 50 poses per tick, where it flew 3 s at 0.5 s, 6 poses), the closed-loop
# wind model and three more cells (52 -> 55), so it costs more: measured on
# the desktop (one process) at 32.8 s before and 89.9 s after (104 s on
# 2026-10-13, after the review's re-cut, with the desktop shared). On GitHub
# at 4418ae0 the step took 20-29 s, so about 55-80 s is to be expected there
# (scaled, not measured). The standalone-test step grows too: on the desktop
# tests/test_sweep.py took 85 s at 4418ae0 and 228 s on 2026-10-13 (its
# episodes fly the 5 s forecast), and the test_harnesstruth_* files add 65 s
# (five files then; the sixth, test_harnesstruth_response of 2026-10-20,
# about 20 s more on the desktop), about 3.5-4 minutes per job in all; on
# GitHub, where that step took 2:36-3:54 at 4418ae0, roughly 5-8 minutes is
# to be expected (scaled, not measured). The files added on 2026-10-19 took
# 40-50 s together per job in
# the WSL venvs, test_deploy_configs 11-14 s of it there (70-125 s alone on
# the desktop, where its `docker compose config` and git checks run). The 40
# files that made the list complete add about 60-75 s per job there (the
# three venvs running side by side; test_paraphraser and
# test_profile_shield_tick about 10 s each, test_build_public_site 7 s in a
# git checkout), and the claims scan 2-3 s.
# The steps together fit the 30-minute timeout. The requirements are pinned
# (shapely, numpy by interpreter) since the same day. The nightly profile is
# defined in .github/workflows/nightly.yml, not here, and has not run: GitHub
# schedules only the default branch's workflows, which is `main` on GitHub,
# while this file, nightly.yml and every push are on `master` (that file's
# header).
#
# WHAT DOES NOT RUN HERE, AND WHY
#
#   Tests that need flight artefacts under demo/out/ (gitignored, ~3 GB), the
#   simulators, WSL, ROS 2, ArduPilot SITL or a GPU. Inside the listed files
#   they report SKIP on a clean clone rather than PASS (WHAT SKIPS above); the
#   files that FAIL without them are under NOT LISTED. They are run on the lab
#   machine. The smoke profile here is the headless backend: functional
#   evidence, never KPI-grade (its manifests say `headless-kinematic`).
#
# The three jobs are the interpreters the project actually uses: 3.10 (the
# OpenVLA flight environment imports guardrail from source), 3.11 (the grant's
# floor, pyproject's requires-python) with the optional extras, and 3.11 with
# requirements.txt alone, no optional extra (not even `cryptography`), where
# every optional import must keep holding. (That job was described as the
# vla-drone environment; vla-drone has cryptography, FastAPI and uvicorn
# since, so it is closer to the extras job.)

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  guardrail:
    # A short name that does not change with the matrix's lists: without it
    # GitHub names each job after every matrix value, so adding a file to
    # `no_skip` renamed the job (and broke any check keyed on its name).
    name: guardrail (${{ matrix.python }}${{ matrix.extras == '' && ', requirements only' || ', extras' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The quotes around protobuf>=7.35.1 matter: `extras` is pasted into
          # a bash line, where a bare `>` would redirect pip's output.
          # `no_skip` names the files that must not print a single SKIP on
          # that job, because the job installs everything they import.
          # uvicorn and jsonschema are pinned to vla-drone's versions:
          # guardrail/api.py reaches into uvicorn.config / uvicorn.importer,
          # which are not a stable interface. pyarrow too (the version the
          # Parquet writer was built and read back with); 26.0.0 has no
          # Python 3.10 wheel, so the 3.10 job does without it.
          - python: "3.10"
            extras: "cryptography grpcio==1.84.0 'protobuf>=7.35.1' grpcio-tools==1.84.0"
            no_skip: "tests/test_harness_service.py tests/test_paraphraser_service.py"
          - python: "3.11"
            extras: "cryptography fastapi httpx uvicorn==0.50.2 jsonschema==4.26.0 grpcio==1.84.0 'protobuf>=7.35.1' grpcio-tools==1.84.0 pyarrow==26.0.0"
            no_skip: "tests/test_railinputs_node.py tests/test_railinputs_hotapply.py tests/test_api.py tests/test_harness_service.py tests/test_paraphraser_service.py tests/test_wp4outputs_exporters.py"
          - python: "3.11"
            extras: ""
            no_skip: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # requirements.txt carries jinja2 since 2026-10-06 (guardrail/compiler.py
      # build_prompt() and summary_pack() render through it), so it is no
      # longer named here by hand. pyproject's `api` extra (fastapi, uvicorn)
      # plus httpx goes only to the 3.11 extras job: tests/test_api.py's route
      # tests need httpx for TestClient, and the railinputs hot-apply and
      # listener tests serve over real HTTP and mTLS through uvicorn, which
      # fastapi does not pull in (until 2026-10-19 no job had it). grpcio and
      # protobuf (pyproject's `harness` extra) and grpcio-tools go to the two
      # jobs with cryptography, for tests/test_harness_service.py. pyarrow
      # (pyproject's `export` extra) goes to the 3.11 extras job only, for
      # tests/test_wp4outputs_exporters.py's Parquet tests.
      - name: Install the guardrail's dependencies
        run: python -m pip install -r requirements.txt ${{ matrix.extras }}

      - name: Standalone test files
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          # python's own exit code is read from PIPESTATUS (no pipefail, so a
          # failing file does not end the loop), and on the job whose
          # matrix.no_skip names a file, a SKIP line from that file fails
          # the job: a skip there means an installed dependency went unused.
          set +o pipefail
          fail=0
          out="$RUNNER_TEMP/test-output.txt"
          for t in \
              tests/test_scenario_spec.py \
              tests/test_sweep.py \
              tests/test_failsafe_rubric.py \
              tests/test_shield.py \
              tests/test_shield_events.py \
              tests/test_ir.py \
              tests/test_api.py \
              tests/test_corridor.py \
              tests/test_clearance.py \
              tests/test_check_contract.py \
              tests/test_guardrail_coverage.py \
              tests/test_kpi_magnitudes.py \
              tests/test_kpi_blind.py \
              tests/test_manifest.py \
              tests/test_bundle.py \
              tests/test_frame_contract.py \
              tests/test_harness_service.py \
              tests/test_harnesstruth_forecast.py \
              tests/test_harnesstruth_rtl.py \
              tests/test_harnesstruth_wind.py \
              tests/test_harnesstruth_bundles.py \
              tests/test_harnesstruth_ci.py \
              tests/test_harnesstruth_response.py \
              tests/test_env_pins.py \
              tests/test_flight_pas_ap_20261008.py \
              tests/test_own_velocity_forecast.py \
              tests/test_shieldcore_repair.py \
              tests/test_shieldcore_audit.py \
              tests/test_shieldcore_identity.py \
              tests/test_shieldcore_onepath.py \
              tests/test_railinputs_fence_export.py \
              tests/test_railinputs_clock.py \
              tests/test_railinputs_policy.py \
              tests/test_railinputs_manifest.py \
              tests/test_railinputs_node.py \
              tests/test_railinputs_hotapply.py \
              tests/test_railinputs_perception.py \
              tests/test_wp4outputs_kpi_report.py \
              tests/test_wp4outputs_exporters.py \
              tests/test_wp4outputs_harness.py \
              tests/test_railvideo_truth_frame.py \
              tests/test_railvideo_recording.py \
              tests/test_railvideo_compare.py \
              tests/test_explainer_figures.py \
              tests/test_explainer_deck.py \
              tests/test_fsm.py \
              tests/test_hold_points.py \
              tests/test_hold_transit.py \
              tests/test_window_lead_lint.py \
              tests/test_window_opens_on.py \
              tests/test_position_quality.py \
              tests/test_policy_hash.py \
              tests/test_csp.py \
              tests/test_policy_dsl_grant_form.py \
              tests/test_distance_envelope_msl.py \
              tests/test_replay_identity.py \
              tests/test_vla_backends.py \
              tests/test_vla_link.py \
              tests/test_prefix_eval.py \
              tests/test_fenceguard.py \
              tests/test_follow_motion.py \
              tests/test_identity.py \
              tests/test_identity_lock.py \
              tests/test_pas_ardupilot.py \
              tests/test_sitl_rails.py \
              tests/test_sitl_stressors.py \
              tests/test_mavlink_adapter.py \
              tests/test_ros2_vla_bridge.py \
              tests/test_deploy_configs.py \
              tests/test_public_docs.py \
              tests/test_ft_report.py \
              tests/test_replay.py \
              tests/test_geo_to_policy.py \
              tests/test_wp1_roundtrip_kpi.py \
              tests/test_paraphraser.py \
              tests/test_paraphraser_service.py \
              tests/test_real_vla_prompt.py \
              tests/test_profile_shield_tick.py \
              tests/test_occ_bands.py \
              tests/test_ros2_package.py \
              tests/test_kpi_report.py \
              tests/test_recorder.py \
              tests/test_track_truth.py \
              tests/test_camera_model.py \
              tests/test_target_state.py \
              tests/test_trail.py \
              tests/test_search.py \
              tests/test_landing.py \
              tests/test_level_actors.py \
              tests/test_voxel_map.py \
              tests/test_replay_pipeline.py \
              tests/test_demo_negative_xy.py \
              tests/test_vla_bridge.py \
              tests/test_vla_backend_table.py \
              tests/test_vla_server.py \
              tests/test_aerialvla_codec.py \
              tests/test_vla_fly.py \
              tests/test_vla_fly_fakesim.py \
              tests/test_vla_replay_gate.py \
              tests/test_vla_follow_smooth.py \
              tests/test_finetune_follow.py \
              tests/test_pas_vla.py \
              tests/test_follow_dataset.py \
              tests/test_vla_dagger.py \
              tests/test_vla_prev_front_rate.py \
              tests/test_follow_hint_modes.py \
              tests/test_follow_decide_rate.py \
              tests/test_vla_speed_words.py \
              tests/test_vla_follow_reacquire.py \
              tests/test_vla_hierarchy.py \
              tests/test_vla_foreign.py \
              tests/test_aiotvla.py \
              tests/test_vla_lateral_step.py \
              tests/test_follow_teacher.py \
              tests/test_vla_standoff_feed.py \
              tests/test_held_box_gate.py \
              tests/test_citylife_peds.py \
              tests/test_citylife_routes.py \
              tests/test_citylife_signal_lamps.py \
              tests/test_citylife_signals.py \
              tests/test_citylife_traffic_model.py \
              tests/test_car_speed.py \
              tests/test_drive_signals_dsl.py \
              tests/test_ped_walk_plan.py \
              tests/test_parked_cars.py \
              tests/test_check_claims.py \
              tests/test_build_public_site.py \
              tests/test_build_mideval_report.py \
              tests/test_build_deck_data.py \
              tests/test_build_eval_data.py \
              tests/test_build_progress_oct_data.py \
              tests/test_build_progress_1028_data.py \
              tests/test_city_episode.py \
              tests/test_tracker_content.py \
              tests/test_tracker_serve.py \
              tests/test_add_update.py \
              tests/test_build_dashboard.py \
              tests/test_live_status.py \
              tests/test_todo.py \
              tests/test_encode_deliverable.py \
              tests/test_make_demo_video.py \n              tests/test_ci_local.py \n              tests/test_render_track_video.py; do
            echo "::group::$t"
            python "$t" 2>&1 | tee "$out"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then
              echo "::error file=$t::$t failed"
              fail=1
            fi
            case " ${{ matrix.no_skip }} " in
              *" $t "*)
                if grep -q '^SKIP' "$out"; then
                  echo "::error file=$t::$t skipped a test this job installs the dependencies for"
                  fail=1
                fi;;
            esac
            echo "::endgroup::"
          done
          exit $fail

      # The AerialVLA image path with Pillow (review of V1a, P9): the mosaic a
      # flight depends on, the base64/JPEG round trip, the decompression-bomb
      # refusal and real frames through the server SKIPped on every job,
      # because no job installs Pillow. Here, on the 3.10 job only (vla-real,
      # the environment that serves AerialVLA, is 3.10 with Pillow 12.2.0),
      # Pillow goes into a directory that only this step puts on PYTHONPATH:
      # the loop above, where test_railvideo_recording's Pillow wall-clock
      # tests are kept lab-only, and the smoke step never see it.
      # GUARDRAIL_REQUIRE_PILLOW=1 turns those tests' SKIP into a failure, so
      # a broken install cannot pass as an absent package. The two files'
      # other SKIP (the D:/models folders) stays a SKIP. test_follow_dataset
      # (2026-10-23) runs here too, for its training mosaic and its mirror
      # (the PNG the trainer reads must be the server's mosaic, or exactly its
      # left-right flip); its OpenCV test SKIPs. test_vla_prev_front_rate
      # (2026-10-24) for its prev_front mosaic, its mirror and the evaluation
      # tool's prev_front requests; its torch test SKIPs. test_vla_speed_words
      # (2026-10-24) for the evaluation of a speed-words dataset through the
      # server's mosaic; its torch test SKIPs. test_policy_hud and
      # test_hud_fits (2026-11-04) for the video panels: drawn on blank
      # frames, every panel's ink inside its box, the P0 escapes on the frame,
      # the model the server named.
      - name: AerialVLA image tests (Pillow)
        if: matrix.python == '3.10'
        env:
          PYTHONUNBUFFERED: "1"
          GUARDRAIL_REQUIRE_PILLOW: "1"
        run: |
          python -m pip install --target "$RUNNER_TEMP/pillow" pillow==12.2.0
          fail=0
          for img in tests/test_aerialvla_codec.py tests/test_vla_server.py tests/test_follow_dataset.py tests/test_vla_prev_front_rate.py tests/test_vla_speed_words.py tests/test_policy_hud.py tests/test_hud_fits.py; do
            echo "::group::$img (with Pillow)"
            if ! PYTHONPATH="$RUNNER_TEMP/pillow" python "$img"; then
              echo "::error file=$img::$img failed with Pillow installed"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      # tests/test_check_claims.py above checks the scan; this runs the tool as
      # a reader would, so its exit code (a live withdrawn claim, or a missing
      # corrected value, anywhere in its default scope) gates the job. Absent
      # lab-only documents print SKIP-LOCAL and do not fail it
      # (tools/check_claims.py LOCAL_ONLY).
      - name: Withdrawn-claim scan
        run: python tools/check_claims.py

      - name: Smoke profile (stress harness, headless)
        run: >
          python experiments/sweep_scenarios.py --profile smoke
          --out ci-smoke/sweep.json --runs ci-smoke/episodes

      - name: Keep the smoke results, episode bundles and KPI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-py${{ matrix.python }}${{ matrix.extras == '' && '-nosigning' || '' }}
          path: ci-smoke/
          if-no-files-found: warn
