site_name: Constrained VLA for ArduPilot — Simulation Framework Survey
site_description: Survey and architecture decisions for the ITRI ICL 115-year Constrained VLA grant (Feb–Nov 2026)
site_author: Kuan-Ting Lai, NTUT AIoT Lab

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - toc.integrate
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

nav:
  - Home: index.md
  - Context:
      - Grant overview: 01-context/grant-overview.md
      - Architecture constraints: 01-context/architecture-constraints.md
  - Implementation plan:
      - Overview: 02-implementation/overview.md
      - Policy DSL: 02-implementation/policy-dsl.md
      - Prefix Compiler: 02-implementation/prefix-compiler.md
      - Safety Shield: 02-implementation/safety-shield.md
      - Stress Testing: 02-implementation/stress-testing.md
  - Simulation framework:
      - Layer requirements: 03-simulation/layer-requirements.md
      - Inner-loop candidates: 03-simulation/inner-loop.md
      - World/perception candidates: 03-simulation/world-perception.md
      - Comparison matrix: 03-simulation/comparison-matrix.md
      - Dual-rail decision: 03-simulation/dual-rail.md
      - Deployment topologies: 03-simulation/topologies.md
      - Data flow: 03-simulation/data-flow.md
  - Risks & fallbacks:
      - Risks: 04-risks-and-fallbacks/risks.md
      - Fallback gates: 04-risks-and-fallbacks/fallback-gates.md
  - Recommendation: 05-recommendation/recommendation.md
  - References: references.md
