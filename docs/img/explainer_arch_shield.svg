<path d="M548,544 L548,518" fill="none" stroke="#56626C" stroke-width="2.6"/>
<text x="60" y="678" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="21" font-weight="400" fill="#3F4A54" text-anchor="start">G1 a repair within theta: 2.0 m lateral, 0.5 m vertical;  G2 N = 3 onsets in T = 5 s</text>
<text x="60" y="704" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="21" font-weight="400" fill="#3F4A54" text-anchor="start">G3 a repair over theta;  G4 N new onsets in Loiter;  G5 30 s in Loiter;  G6 RTL fails</text>
<text x="60" y="730" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="21" font-weight="400" fill="#3F4A54" text-anchor="start">G7, G8 back to Normal after T_recover = 2 s clear;  X6, X7 a position illegal or worse</text>
<text x="60" y="756" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="21" font-weight="400" fill="#3F4A54" text-anchor="start">Loiter is flown as ArduCopter BRAKE: LOITER sinks with no pilot on the throttle</text>
<rect x="1150" y="458" width="410" height="320" rx="12" fill="#FFFFFF" stroke="#1A7484" stroke-width="2.2"/>
<text x="1168" y="500.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="25" font-weight="600" fill="#1A1A1A" text-anchor="start">Emitted action + audit</text>
<text x="1168" y="532.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">• the action, back to body frame</text>
<text x="1168" y="558.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">• SET_MODE when the FSM</text>
<text x="1182" y="584.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">changes state</text>
<text x="1168" y="610.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">• an audit record: policy_hash,</text>
<text x="1182" y="636.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">generation, raw and emitted</text>
<text x="1182" y="662.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">action, every operator tried,</text>
