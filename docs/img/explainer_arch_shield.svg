<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="786" viewBox="0 0 1600 786">
<defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L12,6 L0,11.5 z" fill="#56626C"/></marker></defs>
<rect width="1600" height="786" fill="#FFFFFF"/>
<text x="40" y="30" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="700" fill="#1A7484" text-anchor="start" letter-spacing="1.5">ONE TICK OF THE SAFETY SHIELD, EVERY 0.1 S</text>
<rect x="40" y="56" width="490" height="164" rx="12" fill="#EAF6F8" stroke="#249DB2" stroke-width="2.2"/>
<text x="58" y="98.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="25" font-weight="600" fill="#1A1A1A" text-anchor="start">Inputs</text>
<text x="58" y="130.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">• vehicle state: pose, heading</text>
<text x="58" y="156.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">• raw action, body to world frame</text>
<text x="58" y="182.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">• the rules in force on the</text>
<text x="72" y="208.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">tick's clock</text>
<circle cx="44" cy="58" r="19" fill="#12545F" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="44" y="65.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" class="ordinal">1</text>
<rect x="555" y="56" width="490" height="164" rx="12" fill="#EAF6F8" stroke="#249DB2" stroke-width="2.2"/>
<text x="573" y="98.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="25" font-weight="600" fill="#1A1A1A" text-anchor="start">Forecast</text>
<text x="573" y="130.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">• 5 s ahead in 0.1 s steps: 50 poses</text>
<text x="573" y="156.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">• each pose judged by the rules</text>
<text x="587" y="182.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">in force at its own time</text>
<circle cx="559" cy="58" r="19" fill="#12545F" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="559" y="65.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" class="ordinal">2</text>
<rect x="1070" y="56" width="490" height="164" rx="12" fill="#EAF6F8" stroke="#249DB2" stroke-width="2.2"/>
<text x="1088" y="98.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="25" font-weight="600" fill="#1A1A1A" text-anchor="start">Spatial index</text>
<text x="1088" y="130.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">• STRtree over the zones' margins</text>
<text x="1088" y="156.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">• moving zone: reach bound first,</text>
<text x="1102" y="182.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">its polygon only where the</text>
<text x="1102" y="208.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">forecast can meet it</text>
<circle cx="1074" cy="58" r="19" fill="#12545F" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="1074" y="65.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" class="ordinal">3</text>
<rect x="40" y="260" width="490" height="164" rx="12" fill="#EAF6F8" stroke="#249DB2" stroke-width="2.2"/>
<text x="58" y="302.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="25" font-weight="600" fill="#1A1A1A" text-anchor="start">Rule checks</text>
<text x="58" y="334.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">• hard before soft, P0 &gt; P1 &gt; P2</text>
<text x="58" y="360.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">• zones, altitude, speed,</text>
<text x="72" y="386.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">clearance, stand-off, corridor</text>
<text x="58" y="412.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">• monitor_only: logged, not fixed</text>
<circle cx="44" cy="262" r="19" fill="#12545F" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="44" y="269.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" class="ordinal">4</text>
<rect x="555" y="260" width="490" height="164" rx="12" fill="#EAF6F8" stroke="#249DB2" stroke-width="2.2"/>
<text x="573" y="302.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="25" font-weight="600" fill="#1A1A1A" text-anchor="start">Repair chain</text>
<text x="573" y="334.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">• KinematicClamp, AltitudeClamp,</text>
<text x="587" y="360.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">then up to 3 passes: Clearance,</text>
<text x="587" y="386.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">Standoff, Corridor, Lateral</text>
<text x="573" y="412.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">• opt-in: first-feasible, PathRepair</text>
<circle cx="559" cy="262" r="19" fill="#12545F" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="559" y="269.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" class="ordinal">5</text>
<rect x="1070" y="260" width="490" height="164" rx="12" fill="#EAF6F8" stroke="#249DB2" stroke-width="2.2"/>
<text x="1088" y="302.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="25" font-weight="600" fill="#1A1A1A" text-anchor="start">Re-check</text>
<text x="1088" y="334.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">• the repaired action is checked</text>
<text x="1102" y="360.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">again; still illegal: a recovery</text>
<text x="1088" y="386.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">• soft rules given up, lowest first</text>
<text x="1088" y="412.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="22" font-weight="400" fill="#3F4A54" text-anchor="start">• else BRAKE, only where legal</text>
<circle cx="1074" cy="262" r="19" fill="#12545F" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="1074" y="269.5" font-family="Poppins, &apos;Segoe UI&apos;, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" class="ordinal">6</text>
