  <text x="40" y="1088" font-size="10.5" fill="#B23F38" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">This is the distinction v2 did not draw. It said "today: AirSim Blocks · later: SITL + HIL", and was still saying it on 2026-09-02.</text>
  <text x="40" y="1104" font-size="10.5" fill="#6B7280" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Closing the gap means feeding AirSim imagery to a Guardrail driven over MAVROS — the HIL_GPS / HIL_SENSOR bridge. Largest remaining item.</text>
