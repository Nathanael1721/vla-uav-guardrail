  <text x="54" y="182" font-size="11.5" fill="#249DB2" font-weight="600" text-anchor="start" font-family="Consolas, monospace">Constraint Summary Pack · 4 rules</text>
  <text x="54" y="197" font-size="10" fill="#6B7280" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">the prompt renders FROM the pack, so they cannot disagree</text>
  <text x="468" y="211" font-size="9" fill="#9AA6AF" font-weight="normal" text-anchor="end" font-family="Consolas, monospace">evidence 2026-09-01</text>
