  <text x="40" y="46" font-size="19" fill="#1F2A33" font-weight="700" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Semantic-Spatial Translation and Safety-Constrained VLA for ArduPilot UAVs</text>
  <text x="40" y="68" font-size="11.5" fill="#6B7280" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Architecture v3 — NTUT AIoT Lab, Guardrail work packages. Supersedes v2 (2026-07-03).</text>
  <text x="40" y="88" font-size="10.5" fill="#1A7484" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Every status below is read from the artefact that proves it, at build time. Generated 2026-09-02.</text>
