  <rect x="560" y="236" width="3.5" height="88" rx="2" fill="#249DB2"/>
  <text x="574" y="256" font-size="13.5" fill="#1F2A33" font-weight="600" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Signed policy bundle</text>
  <text x="574" y="272" font-size="11" fill="#6B7280" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">ir.json + manifest.json + signature.txt</text>
  <text x="574" y="290" font-size="11.5" fill="#249DB2" font-weight="600" text-anchor="start" font-family="Consolas, monospace">signed bundle round-trips · 694 B</text>
  <text x="574" y="305" font-size="10" fill="#6B7280" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">reload refuses a tampered IR, a foreign manifest, a truncation</text>
  <text x="988" y="315" font-size="9" fill="#9AA6AF" font-weight="normal" text-anchor="end" font-family="Consolas, monospace">evidence 2026-09-01</text>
