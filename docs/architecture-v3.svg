  <text x="54" y="610" font-size="11.5" fill="#249DB2" font-weight="600" text-anchor="start" font-family="Consolas, monospace">5 sources flown · P0 escape 0 in all five</text>
  <text x="54" y="625" font-size="10" fill="#6B7280" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">OpenVLA-7B · AerialVLA · QLoRA fine-tunes · BC policy · hand-written</text>
