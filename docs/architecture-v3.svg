  <text x="574" y="197" font-size="10" fill="#6B7280" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">reference implementation carries 2</text>
  <text x="988" y="211" font-size="9" fill="#9AA6AF" font-weight="normal" text-anchor="end" font-family="Consolas, monospace">evidence 2026-09-01</text>
