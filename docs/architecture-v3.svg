  <text x="54" y="710" font-size="11" fill="#6B7280" font-weight="normal" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">monitor (3 s lookahead)  -&gt;  repair operators  -&gt;  re-check the flown action  -&gt;  recovery heading  -&gt;  brake</text>
  <text x="54" y="728" font-size="11.5" fill="#1A7484" font-weight="600" text-anchor="start" font-family="Consolas, monospace">P0 escape rate 0.0 · KPI-grade</text>
