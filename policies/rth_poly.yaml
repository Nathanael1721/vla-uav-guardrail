policy_id: rth-poly-demo
version: 0.1.2
# WGS84 since 2026-11-03 (tools/convert_policies_wgs84.py, from the
# metres of 0.1.1). Frame origin: the Project AirSim scenes' home-geo-point.
# Points are lat/lon; the x North / y East metres about this origin
# that comments here use are the view the Shield computes from them.
origin:
  lat: 35.6895
  lon: 139.6917
constraints:
  - id: tri-nfz
    type: polygon_fence
    constraint_type: hard
    priority: P0
    violation_action: project_fix
    vertices:
      - {lat: 35.689769494585, lon: 139.691567275177}
      - {lat: 35.689985090253, lon: 139.691567275177}
      - {lat: 35.689877292419, lon: 139.691832724823}
    altitude_floor_m: 0
    altitude_ceiling_m: 60
    margin_m: 1.0
  - id: bld-clearance
    type: obstacle_clearance
    constraint_type: hard
    priority: P0
    violation_action: project_fix
    min_clearance_m: 5.0
    soft_margin_m: 2.0
  - id: alt-band
    type: altitude_envelope
    constraint_type: hard
    priority: P0
    violation_action: project_fix
    alt_min_m: 35
    alt_max_m: 55
  - id: kin-caps
    type: kinematic_envelope
    constraint_type: hard
    priority: P1
    violation_action: project_fix
    speed_max_mps: 4.0
    climb_rate_max_mps: 2.0
    yaw_rate_max_dps: 45.0
