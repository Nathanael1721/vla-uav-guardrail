# Sim demo policy — same rules as demo_policy.yaml but altitude band lifted to
# 10-20 m so the mission flies ABOVE the physical blocks in the Blocks world.
# (Physical obstacle avoidance is the OTHER team's layer; the Guardrail only
# enforces policy constraints.)
policy_id: fase3-sim-demo
version: 0.1.4
# WGS84 since 2026-11-03 (tools/convert_policies_wgs84.py, from the
# metres of 0.1.2). Frame origin: ArduPilot SITL --home (CMAC, sitl/start_sitl.sh).
# Points are lat/lon; the x North / y East metres about this origin
# that comments here use are the view the Shield computes from them.
origin:
  lat: -35.363261
  lon: 149.16523

constraints:
  - id: nfz-square
    type: polygon_fence
    constraint_type: hard
    scope: mission
    priority: P0
    violation_action: project_fix
    vertices:
      - {lat: -35.36319811793, lon: 149.165307108696}
      - {lat: -35.363054387485, lon: 149.165307108696}
      - {lat: -35.363054387485, lon: 149.165483357143}
      - {lat: -35.36319811793, lon: 149.165483357143}
    altitude_floor_m: 0
    altitude_ceiling_m: 100
    margin_m: 1.0

  - id: alt-band
    type: altitude_envelope
    constraint_type: hard
    scope: mission
    priority: P0
    violation_action: project_fix
    alt_min_m: 10
    alt_max_m: 20

  - id: kin-caps
    type: kinematic_envelope
    constraint_type: hard
    scope: mission
    priority: P1
    violation_action: project_fix
    speed_max_mps: 4.0
    climb_rate_max_mps: 2.0
    yaw_rate_max_dps: 45.0
