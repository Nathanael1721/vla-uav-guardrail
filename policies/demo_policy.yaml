# Demo policy — mini version of the grant's "Worked DSL example".
# Local frame: x = meters North of start, y = meters East. Altitude = m above ground.
policy_id: fase3-demo
version: 0.1.2
# WGS84 since 2026-11-03 (tools/convert_policies_wgs84.py, from the
# metres of 0.1.1). Frame origin: the Project AirSim scenes' home-geo-point.
# Points are lat/lon; the x North / y East metres about this origin
# that comments here use are the view the Shield computes from them.
origin:
  lat: 35.6895
  lon: 139.6917

constraints:
  # Square no-fly zone centered on (15, 15), 16 m per side.
  - id: nfz-square
    type: polygon_fence
    constraint_type: hard
    priority: P0
    violation_action: project_fix
    vertices:
      - {lat: 35.68956288207, lon: 139.691777422813}
      - {lat: 35.689706612515, lon: 139.691777422813}
      - {lat: 35.689706612515, lon: 139.691954389244}
      - {lat: 35.68956288207, lon: 139.691954389244}
    altitude_floor_m: 0
    altitude_ceiling_m: 100
    margin_m: 1.0

  # Fly between 2 m and 6 m above ground.
  - id: alt-band
    type: altitude_envelope
    constraint_type: hard
    priority: P0
    violation_action: project_fix
    alt_min_m: 2
    alt_max_m: 6

  # Speed / climb / yaw caps.
  - id: kin-caps
    type: kinematic_envelope
    constraint_type: hard
    priority: P1
    violation_action: project_fix
    speed_max_mps: 4.0
    climb_rate_max_mps: 2.0
    yaw_rate_max_dps: 45.0
