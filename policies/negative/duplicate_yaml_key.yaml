# NEGATIVE CORPUS - tools/wp1_roundtrip_kpi.py: load_policy() must refuse this.
# defect: the same key twice in one rule (alt_max_m: 30, then alt_max_m: 300)
# currently: ACCEPTED
# finding: PyYAML keeps the LAST value without a word, so a reviewer reading the first sees 30 m while 300 m is enforced
policy_id: neg-dup-yaml
version: 0.1.0
constraints:
  - id: alt
    type: altitude_envelope
    alt_min_m: 5
    alt_max_m: 30
    alt_max_m: 300
