# A policy written in WGS84, the frame the DSL spec calls canonical, as every
# policy in this directory has been since 2026-11-03.
#
# `policy-dsl.md`: "latitude / longitude is canonical... the DSL itself never
# carries projected coordinates." When this file was written (September 2026)
# it was the only policy in lat/lon; every other one was in local metres and
# lat/lon was additive, projected once at load time. That is no longer so.
#
# WGS84 ONLY (WP1-14)
#
# Since 2026-11-03 every policies/*.yaml is stored and hashed in WGS84 with a
# stated origin (tools/convert_policies_wgs84.py); local metres are a view the
# Shield and the Prefix Compiler compute lazily from that origin. Since
# 2026-11-26 the DSL loaders, REST / gRPC hot-apply, the Shield's events and
# the Ingest CLI refuse a point given in local metres ({x, y}) or with x/y
# beside lat/lon; a tool that works in metres converts them first with
# guardrail.models.wgs84_from_metres. A recorded metre policy is read only
# through a declared legacy read (models.load_legacy_metre_policy).
#
# THE ORIGIN IS REQUIRED, NOT DEFAULTED
#
# Without `origin` the loader REFUSES a geographic policy rather than assuming
# (0, 0). An assumed origin does not fail — it silently relocates every rule in
# the file to the Gulf of Guinea and validates perfectly on the way.
#
# The geometry mirrors the reference implementation's demo bundle so the two can
# be compared directly: a school-yard polygon near NTUT, with the same weekday
# curfew the reference's worked example carries.
policy_id: wgs84-taipei-demo
version: 0.1.2

origin:
  lat: 25.04245
  lon: 121.5314

constraints:
  - id: nfz-school-yard
    type: polygon_fence
    constraint_type: hard
    scope: mission
    priority: P0
    violation_action: project_fix
    vertices:
      - { lat: 25.0421, lon: 121.5310 }
      - { lat: 25.0428, lon: 121.5310 }
      - { lat: 25.0428, lon: 121.5318 }
      - { lat: 25.0421, lon: 121.5318 }
    altitude_floor_m: 0.0
    altitude_ceiling_m: 200.0
    margin_m: 1.0
    valid_time:
      recurrence:
        days: [Mon, Tue, Wed, Thu, Fri]
        start_time: "07:30"
        end_time: "17:30"

  - id: envelope-default
    type: altitude_envelope
    constraint_type: hard
    scope: mission
    priority: P0
    violation_action: project_fix
    alt_min_m: 5.0
    alt_max_m: 80.0

  - id: kin-caps
    type: kinematic_envelope
    constraint_type: hard
    scope: mission
    priority: P1
    violation_action: project_fix
    speed_max_mps: 12.0
    climb_rate_max_mps: 4.0
    yaw_rate_max_dps: 60.0
