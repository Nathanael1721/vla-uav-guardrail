# mavlink-router: one ArduPilot, two ground stations (MAVROS 2 and Mission Planner).
#
# The grant's dev and hil topologies put mavlink-router between ArduPilot SITL
# and everything that talks MAVLink: MAVROS 2 (which carries the Shield's
# setpoints) and Mission Planner (the operator's view), side by side, not in
# series (reference kuanting-vla-uav-guardrail/sim/docker-compose.dev.yml).
#
#   ArduPilot SITL  --SERIAL2 udpclient-->  0.0.0.0:14550 (this router)
#        this router --> 127.0.0.1:14555   MAVROS 2 (fcu_url udp://:14555@)
#        this router --> @GCS_HOST@:14550  Mission Planner on Windows (its default UDP port)
#
# sitl/start_router.sh writes a copy with @GCS_HOST@ replaced (the Windows host
# as WSL sees it, i.e. the default gateway, unless GCS_HOST is set) and starts
# `mavlink-routerd -c <copy>`. Endpoint syntax is mavlink-router v3/v4
# ("Mode = Server" listens, "Mode = Normal" sends to Address:Port).
#
# In the hil topology this file runs on the desktop unchanged, with the
# mavros endpoint's Address set to the Orin (MAVROS_HOST in start_router.sh).

[General]
TcpServerPort = 0
ReportStats = false
MavlinkDialect = ardupilotmega

[UdpEndpoint sitl]
Mode = Server
Address = 0.0.0.0
Port = 14550

[UdpEndpoint mavros]
Mode = Normal
Address = @MAVROS_HOST@
Port = 14555

[UdpEndpoint mission_planner]
Mode = Normal
Address = @GCS_HOST@
Port = 14550
