# The scenario library the sweep harness runs.
#
# `docs/MIDTERM-REPORT-Aug2026.md` states, verbatim, "Scenario sweep harness not
# built." The KPI machinery has always worked one flight at a time, which means
# every guarantee this project makes rests on the handful of missions somebody
# thought to fly by hand.
#
# ONE FILE PER TEMPLATE (since 2026-10-07)
#
# The grant's Stress Testing page lists the scenario library as "YAML files
# (one per template)". The families now live in experiments/templates/, one
# file per template, listed under `templates:` below; this file keeps the
# defaults and the order. guardrail/scenario_spec.py (Library) loads it and
# refuses a template file that holds another template's family, a second file
# for one template, or a file not named after its template. The text of every
# family moved verbatim; only its file changed.
#
# THE SCHEMA (since 2026-10-06)
#
# Every entry is a ScenarioSpec (guardrail/scenario_spec.py), the Pydantic model
# the grant gives on its Stress Testing page, and is validated when this file is
# loaded: a key the schema does not know is an error, not a field nobody reads.
# The grant's fields, in its order:
#
#   scenario_id      unique id
#   template         the family; the grant's four plus named extensions
#   description      what the scenario is for (the old `why`)
#   mission          task_prompt, start_pose, target - plus `pilot`, the
#                    deliberately DUMB stand-in for the VLA, because the
#                    Shield's job is to survive a bad one. A clever pilot that
#                    never asks for anything illegal tests nothing.
#   policy           { path } or the grant's { bundle_path, expected_hash }
#   events           mid-flight ScenarioEvents. All seven of the grant's event
#                    types are applied through the Shield's event APIs (since
#                    2026-10-07; until then only spawn_polygon_fence was, and
#                    the other six were refused). Payloads: EVENT_PAYLOADS in
#                    guardrail/scenario_spec.py
#   parameter_sweep  field -> values; "$field" in the scenario is replaced
#   expected_kpis    what must be true afterwards. A scenario with no gate is a
#                    demonstration, not a test. `P0_escape_rate: 0` and
#                    `">=0.99"` / `"<=2.0"` are read as the grant writes them.
#
# and ours: expected_outcome / expected_failsafe (labels, so "triggered when
# expected, not when not expected" can be measured at all), shield (the OFF arm
# is what proves the harness can still see a failure), escalation (the
# Shield's escalation FSM decides what is flown; default true), stress (GPS
# noise, latency, wind, start jitter), parameter_sample (seeded geometry
# draws), paraphrase / prefix / ab (arms: what the pilot is shown), ticks / dt /
# lookahead_s / lookahead_dt_s (the forecast, below), and
# stress.battery_critical_at_s (the RTL hand-over's battery hook, 2026-10-12).
#
# FAIL-SAFE LABELS (since 2026-10-07)
#
# `expected_failsafe` is about the grant's fail-safe: the escalation FSM
# handing the aircraft to the autopilot's RTL or Land (Safety Shield p1,
# "trigger fail-safe (RTL / Land) when repair is unsafe"; guardrail/fsm.py
# FAILSAFE_STATES). Until 2026-10-07 the harness had no FSM and read "a Shield
# Brake" as the trigger; every label written then was re-measured against the
# FSM, and a Brake (or a Loiter) is not a fail-safe trigger.
#
# `expect: known_failure` marks a scenario whose gates are EXPECTED to fail. It
# is reported as a known failure, never as a pass and never silently. That is
# how an open defect stays visible in the sweep instead of living only in a
# document nobody re-reads.
#
# `expect: tracked` marks a family that measures how far PAST its design point
# the Shield degrades (sensor error beyond the margin, GPS denial, drawn
# gusts). Its gates hold only what must hold whatever happens, so an episode
# that passes them may still have entered a no-fly polygon. It is reported as
# "tracked", counted apart from "pass", with its polygon entries beside it.
#
# The 13 scenarios of the library as it stood before the schema keep their
# behaviour with the escalation FSM off on the 3 s comparison arm, the
# forecast they were measured with (tests/test_sweep.py compares them, and
# pins them at the grant's 5 s beside it, LEGACY_GRANT).
#
# THE STRESS HARNESS (2026-10-06)
#
# Families, not single flights: each expands over its parameter_sweep (the
# grant's cartesian form) and, where it has one, a seeded parameter_sample of
# approach angles. The smoke, nightly and broad profiles in
# experiments/profiles/ choose how much of each to run. Every stress family
# answers one line of the Safety Shield page's smoke matrix (PDF p6), one of
# the grant's four templates, or the grant example's wind sweep, and says
# which.
#
# Gates hold the REQUIREMENT, not what the Shield happened to do. Where a cell
# breaks the requirement it is pinned under `known_failures` with the
# mechanism, measured; any other cell that fails is a new failure.

# THE FORECAST (2026-10-12)
#
# lookahead_s / lookahead_dt_s are the Shields' forecast: the grant's 5 s at
# 0.1 s (Safety Shield p2, "5 s of predicted trajectory at 10 Hz = 50 future
# poses"; guardrail.shield LOOKAHEAD_S / LOOKAHEAD_DT_S). Until 2026-10-12
# this said 3.0 and the harness built every Shield at a 0.5 s step (6 poses),
# so no headless number came from the grant's configuration. The old forecast
# flies only as the labelled comparison arm (`--forecast-arms grant 3s`;
# `--publish` flies both), kept out of every headline number. Each family
# whose purpose was written around the 3 s lookahead was re-checked at 5 s;
# its description says what changed.

defaults:
  dt: 0.1
  ticks: 300
  lookahead_s: 5.0
  lookahead_dt_s: 0.1

templates:
  - templates/static_nfz.yaml
  - templates/altitude_envelope.yaml
  - templates/kinematic_envelope.yaml
  - templates/action_contract.yaml
  - templates/corridor_keep_in.yaml
  - templates/time_window_static.yaml
  - templates/subject_standoff.yaml
  - templates/dynamic_nfz_movement.yaml
  - templates/time_window_switch.yaml
  - templates/radius_scaling.yaml
  - templates/corridor_swap.yaml
  - templates/failsafe_escalation.yaml
  - templates/high_speed_near_edge.yaml
  - templates/three_simultaneous_violations.yaml
  - templates/sensor_degradation.yaml
  - templates/wind_disturbance.yaml
