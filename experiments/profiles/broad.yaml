# Broad sweep profile: the nightly coverage sweep the grant keeps OUT of the KPIs.
#
# Grant, Stress Testing, "Test scheduling":
#   Broad sweep | nightly | ~3000 scenarios x 5 seeds | > 1.0 (functional rail only)
# "The broad sweep runs at speed > 1 for coverage; its results are tracked but
# not part of the final KPI numbers."
#
# DEFINED, NOT ROUTINELY RUN (2026-10-07)
#
# This profile exists so the third row of the grant's table is a file, checked
# like the other two: tests/test_scenario_spec.py expands it, requires the
# count to land in `expected_cells`, and requires that no two of its cells fly
# the same episode. It has not been run end to end. About 15 000 episodes
# (14 930 since the review of 2026-10-12) on the headless backend is an
# estimated 7.1 hours on the desktop at the grant's 5 s forecast, scaled from
# the nightly profile's measured rate on 2026-10-13 (732 episodes in 1251 s,
# 1.71 s per episode; 747 in 1207 s, 1.62 s, on 2026-10-12; 789 in 477 s,
# 0.60 s, at the 3 s forecast flown before, which scales to 2.5 hours; the
# "70 minutes" written here on 2026-10-07 was scaled from a faster nightly
# measurement). An estimate, not a measurement, and longer than one
# GitHub-hosted job may run (6 h), so it is not scheduled in
# .github/workflows/nightly.yml. When it is run, its manifests say
# `headless-kinematic` with
# a measured sim_speedup in the hundreds - the grant's "> 1.0, functional
# rail only" - and the run records `grant_profile_kpi_bearing: false` and
# `kpi_bearing_this_run: false`, so nothing from it can be read as a KPI.
#
# RUNNING IT UNATTENDED (2026-11-17)
#
# The sweep checkpoints every finished episode (--resume DIR), can be split
# into shards (--shard I/N) run side by side, and is merged into one
# sweep.json and kpi_report.md (--merge-only) whose report says the profile
# is outside the KPIs (experiments/sweep_scenarios.py, "UNATTENDED RUNS";
# tests/test_sweep_resume.py). Measured on the desktop on 2026-11-17, on
# shards of this profile (each shard takes every 300th episode, so its family
# mix is the profile's): one process 1.95 s per episode (shard 1/300, 50
# episodes, killed after 23 and resumed with the other 27 only); four shards
# side by side 200 episodes in 109 s, 0.55 s per episode in aggregate (2.14 s
# per episode per process). Scaled to 14 950 episodes, an estimate: about
# 8.1 h in one process, about 2.3 h as four parallel shards. Each episode's
# bundle is about 1.1 MB (about 16 GB for the profile) and its checkpoint
# about 17 kB, so --resume, --runs and --out belong on a disk with room, and
# --runs outside demo/out/stress_*, which tools/kpi_report.py reads by
# default.
#
# HOW THE COUNT IS MADE
#
# Every family's full parameter_sweep (as nightly), and 92 seeded geometry
# draws (`samples_per_family`) per sampled family: each draw is a distinct
# approach angle, and the draw for variant k is the same in every profile, so
# variants 0-2 are the nightly profile's. Arms are off (`paraphrase_k: 0`,
# `prefix_ab: false`): the headless pilots read no text, and this sweep is
# about geometric coverage. Five seeds, as the grant's row asks; a seed changes
# only the episodes that draw from it (GPS noise, gusts, drawn wind, start
# jitter), and the sweep says how many did.
#
#   python experiments/sweep_scenarios.py --profile broad
#   python experiments/sweep_scenarios.py --profile broad --resume DIR --runs RUNS \
#       --out OUT/sweep.json --shard I/4          # I = 1..4, side by side
#   python experiments/sweep_scenarios.py --profile broad --resume DIR --runs RUNS \
#       --out OUT/sweep.json --merge-only

profile: broad
cadence: nightly (coverage, not KPI)
grant_scope: "~3000 scenarios x 5 seeds"
grant_sim_speedup: "> 1.0 (functional rail only) - met: headless backend, measured speedup >> 1"
grant_kpi_bearing: false
library: experiments/scenarios.yaml
seeds: [1001, 1002, 1003, 1004, 1005]
samples_per_family: 92
families: all
expected_cells: [2700, 3300]
paraphrase_k: 0
prefix_ab: false
sweep_overrides: {}
