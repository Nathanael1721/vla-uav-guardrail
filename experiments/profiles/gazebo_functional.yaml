# Gazebo functional profile: a functional sweep on the Gazebo Harmonic rail.
#
# WHY THIS PROFILE EXISTS (2026-11-17, contract item WP4-04; widened 2026-11-21)
#
# Grant, Stress Testing: "Where it runs (Gazebo Harmonic for functional
# sweeps, Project AirSim for perception stress)", and "Test scheduling":
#   Broad sweep | nightly | ~3000 scenarios x 5 seeds | > 1.0 (functional rail only)
# The Gazebo rail first flew end to end on 2026-11-02 (ARCH-16:
# sitl/run_ros2_demo.sh with PHYSICS=gazebo, Gazebo's physics behind SITL's
# JSON backend, the stub pilot through the ROS 2 Shield node and MAVROS 2).
# No sweep had run on it. This profile was the first one: eight smoke cells,
# one seed (2026-11-17). Since 2026-11-21 (WP4-04 / WP4-11a) it is every
# family the rail admits, three seeds, flown one mission per cell and seed by
#
#   python experiments/sweep_scenarios.py --profile gazebo_functional --backend sitl
#
# (`--sitl-dry-run` lists every mission, its tag, environment, command and
# run folder, with nothing flown or written; it needs neither WSL nor
# Gazebo). It also prints the grant's per-episode name
# (`episode-<UTC>--<cell>--seed<n>`) beside each mission: since 2026-11-18
# the rail writes each flown episode's bundle under that name, with the
# grant's six file names.
#
# WHAT IT IS NOT
#
# Not a KPI set (`grant_kpi_bearing: false`). Every mission's scenario record
# says `functional_only` (experiments/sweep_scenarios.py rail_meta), which
# guardrail.manifest.is_kpi_grade refuses whatever the manifest reads, and
# tools/kpi_report.py files it under "gazebo-stress/..." rows, apart from the
# SITL and hil rails' rows. The rail is the desktop's (`dev` topology).
# That exclusion is the lab's choice (KPI-grade runs come from hil), not the
# grant's wording: the grant reports its KPIs from the canonical HIL topology
# (Stress Testing, Purpose), but 03-simulation/dual-rail.md also gives the
# functional rail the "determinism contract for KPI runs" at sim_speedup=1,
# and the grant's "tracked but not part of the final KPI numbers" covers only
# the broad sweep at speed > 1.
#
# THE CELLS
#
# Every family of the library that the rail admits (2026-11-21): each family
# with a cell that neither sweep_scenarios.rail_refusal (the SITL rail's
# limits) nor sweep_scenarios.gazebo_refusal refuses, at the smoke profile's
# cells (experiments/profiles/smoke.yaml's sweep_overrides, copied below for
# the families that have them), less the cells the rail refuses: the 30 m
# start of altitude-recovery-depth (at or above the GeoFence's ceiling) and
# corridor-drift-angles' -60 deg drift (a start yaw off north with no target).
# 40 families, 44 cells (high-speed-near-edge, near-edge-at-12mps,
# time-window-opens-on-vehicle and gps-noise-within-margin keep the smoke's two
# cells each), three seeds: 132 missions, none refused. The GPS noise /
# latency cells fly since 2026-11-21: the ROS 2 Shield node applies them to
# the pose the Shield is handed (WP3-19), on either physics.
#
# Not flown, every cell refused on this rail (sweep_scenarios.sitl_plan on
# physics "gazebo" says why for each): cells that need SITL's SIM_* stressors (gps-dropout,
# wind-within-authority, wind-beyond-authority; SITL's wind does not act on a
# vehicle whose dynamics Gazebo computes), the target-less cells whose start
# yaw is off north (three-simultaneous-violations), and what the SITL rail
# cannot fly on either physics (wind-gusts, failsafe-low-battery,
# nonfinite-action, standoff-reclassified). Arms are off (`paraphrase_k: 0`,
# `prefix_ab: false`): the rails fly the canonical arm only.
#
# SPEED
#
# `rail_sim_speedup: 1.0`, the only value accepted. The grant lets the broad
# sweep run "> 1.0 (functional rail only)", but speeding up SITL and gz sim
# speeds up the simulator only: the Shield node (sitl/ros2_shield_node.py)
# ticks, caps the mission, fires its scheduled events and clocks its rules on
# wall time, so a faster run would fly another scenario than the one its
# record names. Refused (here, in experiments/sweep_scenarios.py and in
# sitl/run_ros2_demo.sh) until the node runs on the autopilot's clock. The
# manifest's sim_speedup is the one the autopilot reports.

profile: gazebo_functional
cadence: on demand (functional rail sweep)
grant_scope: "functional sweeps on Gazebo Harmonic (every family the rail admits, 44 cells x 3 seeds)"
grant_sim_speedup: "> 1.0 allowed for the broad sweep (functional rail only); flown at 1.0: the Shield node runs on wall time"
grant_kpi_bearing: false
rail_physics: gazebo
rail_sim_speedup: 1.0
library: experiments/scenarios.yaml
seeds: [1001, 1002, 1003]
samples_per_family: 1
paraphrase_k: 0
prefix_ab: false
families:
  - nfz-head-on
  - nfz-head-on-control
  - rail-mission-stub-vla
  - altitude-floor-recovery
  - altitude-ceiling-hold
  - altitude-recovery-depth
  - speed-cap
  - corridor-along
  - corridor-drift-out
  - corridor-drift-angles
  - corridor-curfew-in-hours
  - corridor-curfew-out-of-hours
  - standoff-approach
  - standoff-wedge
  - standoff-approach-angles
  - dyn-nfz-spawn-ahead
  - dyn-nfz-spawn-on-top
  - dyn-nfz-translate
  - dyn-nfz-rotate-step
  - dyn-nfz-rotate-spin
  - time-window-closes-mid-run
  - time-window-opens-on-vehicle
  - time-window-opens-on-sideways-pilot
  - time-window-opens-ahead
  - time-window-switch-event
  - rule-deactivated-mid-run
  - rule-activated-mid-run
  - radius-scaling-grow
  - radius-scaling-grow-deep
  - radius-scaling-shrink
  - corridor-swap-shifted
  - corridor-swap-narrowed
  - failsafe-rtl-zone
  - failsafe-land-zone
  - failsafe-loiter-timeout
  - failsafe-rtl-blocked
  - high-speed-near-edge
  - near-edge-at-12mps
  - gps-noise-within-margin
  - gps-noise-beyond-margin
expected_cells: [44, 44]
# The smoke profile's cells, and the two pins that leave out a refused cell
# (altitude-recovery-depth's 30 m, corridor-drift-angles' -60 deg).
sweep_overrides:
  altitude-recovery-depth:
    start_up: [9.5]
  corridor-drift-angles:
    drift_deg: [0]
    ask_mps: [8]
  standoff-approach-angles:
    offset_m: [12]
    subject_class: [pedestrian]
  dyn-nfz-spawn-ahead:
    vehicle_speed_mps: [4]
    ahead_m: [12]
  dyn-nfz-spawn-on-top:
    size_m: [40]
  dyn-nfz-translate:
    zone_mps: [2]
  dyn-nfz-rotate-spin:
    deg_per_s: [3]
  time-window-closes-mid-run:
    clock: ["2026-09-07T17:29:50"]
    vehicle_speed_mps: [4]
  time-window-opens-on-vehicle:
    clock: ["2026-09-07T07:29:58"]
  time-window-opens-ahead:
    clock: ["2026-09-07T07:29:52"]
  rule-activated-mid-run:
    at: [2.0]
  radius-scaling-grow:
    factor: [3.3]
  radius-scaling-shrink:
    factor: [0.5]
  corridor-swap-narrowed:
    ask_mps: [2]
  failsafe-rtl-zone:
    ahead_m: [12]
  high-speed-near-edge:
    pass_y: [23.2]
    ask_mps: [20]
    edge_deg: [0, 90]
  near-edge-at-12mps:
    pass_y: [41.1]
    ask_mps: [12, 20]
  gps-noise-within-margin:
    pass_y: [23.6]
    sigma: [0.3]
    latency: [0, 2]
  gps-noise-beyond-margin:
    pass_y: [23.6]
    sigma: [2.0]
    latency: [5]
