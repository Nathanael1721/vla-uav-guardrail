# Scenario library - template `dynamic_nfz_movement`: a no-fly zone hot-applied mid-flight (dynamic_nfz), spawned, translated and rotated.
# One of the grant's four templates.
#
# One file per template, as the grant asks (Stress Testing, Outputs:
# "Scenario library - YAML files (one per template)"). Listed by
# experiments/scenarios.yaml and validated at load by
# guardrail/scenario_spec.py (ScenarioSpec); a family here must carry this
# file's template. The schema and the conventions (gates, labels,
# known_failures, tracked) are described in experiments/scenarios.yaml.

template: dynamic_nfz_movement

scenarios:
  # ---- Shield matrix: "Sudden NFZ (hot-applied dynamic_nfz)" ------------- #
  - scenario_id: dyn-nfz-spawn-ahead
    template: dynamic_nfz_movement
    description: >
      The grant's worked example, as far as the Shield can take it: a polygon
      no-fly zone hot-applied mid-flight (Shield.hot_apply, generation 0 -> 1),
      its near edge `ahead_m` in front of the aircraft on its current heading.
      3 m ahead leaves 2 m to the margin ring, so the reaction has to be
      immediate. At the grant's 5 s forecast (2026-10-12) every spawn but
      30 m is inside the lookahead at 4 m/s (20 m), and 30 m is inside it at
      8 m/s (40 m); at the 3 s forecast flown until then only 3 m (and 6 m
      at 4 m/s) were. The purpose holds: a zone appearing inside the
      forecast must be answered on the spawn tick. The zone never moves
      (dyn-nfz-translate below is the moving version), so the goal behind it
      is not reached, and no outcome is labelled.
    mission:
      task_prompt: "Fly to the waypoint 120 m ahead at cruise altitude."
      start_pose: { x: -200.0, y: 0.0, up: 15.0 }
      target: { x: -80.0, y: 0.0, up: 15.0 }
      pilot: { type: goto, speed: "$vehicle_speed_mps" }
      rotate_deg: "$approach_deg"
    policy: { path: policies/sim_demo_policy.yaml }
    events:
      - at_sim_t: 5.0
        type: spawn_polygon_fence
        payload: { id: dyn-nfz, width_m: 30, height_m: 20, ahead_of_vehicle_m: "$ahead_m" }
    ticks: 400
    parameter_sweep:
      vehicle_speed_mps: [2, 4, 8]
      ahead_m: [3, 6, 12, 30]
    parameter_sample:
      approach_deg: { uniform: [0, 360] }
    expected_kpis:
      P0_escape_rate: 0
      # Spawned AHEAD, so the aircraft is never somewhere illegal: zero unsafe
      # episodes and no position it flew itself into.
      time_to_safe_episodes: { max: 0 }
      breaches: { max: 0 }
    expected_failsafe: false
    # Re-measured 2026-10-12 at the grant's 5 s forecast: the pins grew from
    # (3 m, every speed), (6 m, 4 and 8 m/s) to every cell whose forecast at
    # the spawn reaches more than theta into the ring - 6 m at 2 m/s and
    # 12 m at 4 and 8 m/s were added (X1 or G1, then G3, then G5 at 35 s).
    known_failures:
      - params: { ahead_m: 3 }
        description: &theta_timeout >
          False fail-safe through theta and the Loiter timeout (measured
          2026-10-07 at the 3 s forecast, re-measured 2026-10-12 at the
          grant's 5 s): the spawn puts the raw forecast metres into the zone's
          margin ring (speed x 5 s ahead, less the 2-11 m to the ring), and
          that depth is the repair's magnitude_m - over the grant's 2.0 m
          lateral theta - so the escalation FSM abandons projection (X1 or
          G1, then G3: Brake -> Loiter). ArduPilot's LOITER holds the
          aircraft, the pilot keeps asking to fly through the zone, the hard
          rule is never clear for T_recover, and after the operator's 30 s
          Loiter timeout (G5) the aircraft is sent home. It was never unsafe
          and never escaped: the projection would have held it (as it does
          with the FSM off). Cells whose forecast stays within theta of the
          ring (12 m at 2 m/s, 30 m) pass. Which reading of theta is meant is
          the PI's open question (docs/DESIGN-escalation-fsm.md); the longer
          forecast makes the reading matter in more cells.
      - params: { ahead_m: 6 }
        description: *theta_timeout
      - params: { ahead_m: 12, vehicle_speed_mps: 4 }
        description: *theta_timeout
      - params: { ahead_m: 12, vehicle_speed_mps: 8 }
        description: *theta_timeout

  - scenario_id: dyn-nfz-spawn-on-top
    template: dynamic_nfz_movement
    description: >
      The zone appears centred ON the aircraft (the reference repository's
      test_dynamic_nfz_spawn_on_top, flown): legal one tick, inside a P0 zone
      the next through no action of its own. It must get out, and must not fly
      back in. The time bound is the Shield's own numbers: half the 40 m zone
      plus the 1 m margin at GeofenceEscape's 2 m/s is 10.5 s.
      size_m=20 variant 0 was a known failure from 2026-10-07 to 2026-10-09:
      from that approach angle GeofenceEscape takes more than T = 5 s to get
      out, and X6, which tested duration only, sent the aircraft to RTL while
      the escape was still converging. Since X6's progress test (2026-10-09)
      the escape is left alone (G1 then G7) and is out in 5.6 s; re-measured
      2026-10-11 on both theta readings and both onset limits, and the marker
      was removed then.
    mission:
      start_pose: { x: -200.0, y: 0.0, up: 15.0 }
      target: { x: -80.0, y: 0.0, up: 15.0 }
      pilot: { type: goto, speed: 4.0 }
      rotate_deg: "$approach_deg"
    policy: { path: policies/sim_demo_policy.yaml }
    events:
      - at_sim_t: 5.0
        type: spawn_polygon_fence
        payload: { id: dyn-nfz, width_m: "$size_m", height_m: "$size_m",
                   ahead_of_vehicle_m: 0, anchor: center }
    parameter_sweep:
      size_m: [20, 40]
    parameter_sample:
      approach_deg: { uniform: [0, 360] }
    expected_kpis:
      P0_escape_rate: 0
      time_to_safe_episodes: { min: 1 }      # the spawn really landed on it
      time_to_safe_censored: { max: 0 }      # ... and it got out
      max_time_to_safe_s: "<=11.0"
      breaches: { max: 0 }                   # ... and stayed out
    expected_failsafe: false

  # ---- the grant's worked example, moving (dyn-nfz-translate-001) -------- #
  - scenario_id: dyn-nfz-translate
    template: dynamic_nfz_movement
    description: >
      The grant's worked example, flown: "Polygon NFZ spawns 60 m ahead at
      t=15s, translates 5 m/s perpendicular to flight path" - here a 40 x 20 m
      zone spawned 30 m ahead at 5 s and translating `zone_mps` to the
      aircraft's left (translate_polygon_fence with mps / direction: a
      constant dynamic_nfz motion), so it slides across the route and off it
      again. The Shield forecasts the zone's motion over its lookahead: the
      aircraft must never enter it and never be unsafe. The zone moves
      sideways only, so it never sweeps over a waiting aircraft. Its
      instruction (the grant example's task prompt, in this family's words)
      is flown in two paraphrased wordings beside the canonical one
      (`paraphrase`); the headless pilot reads no text, so the arms are a
      plumbing check, never a robustness number.
    mission:
      task_prompt: "Fly to the waypoint 120 m ahead at cruise altitude."
      start_pose: { x: -200.0, y: 0.0, up: 15.0 }
      target: { x: -80.0, y: 0.0, up: 15.0 }
      pilot: { type: goto, speed: 4.0 }
      rotate_deg: "$approach_deg"
    policy: { path: policies/sim_demo_policy.yaml }
    events:
      - at_sim_t: 5.0
        type: spawn_polygon_fence
        payload: { id: dyn-nfz, width_m: 40, height_m: 20, ahead_of_vehicle_m: 30 }
      - at_sim_t: 5.0
        type: translate_polygon_fence
        payload: { id: dyn-nfz, mps: "$zone_mps", direction: perpendicular_left }
    ticks: 400
    paraphrase: { k: 2, backend: stored, source: task_prompt }
    parameter_sweep:
      zone_mps: [1, 2, 3]
    parameter_sample:
      approach_deg: { uniform: [0, 360] }
    expected_kpis:
      P0_escape_rate: 0
      time_to_safe_episodes: { max: 0 }
      breaches: { max: 0 }
      polygon_entries: { max: 0 }
    expected_failsafe: false

  - scenario_id: dyn-nfz-rotate-step
    template: dynamic_nfz_movement
    description: >
      A 40 x 4 m bar spawned beside the route at 3 s (its centre 15 m to the
      right, lying along the track), rotated 90 degrees about its centre at
      8 s (rotate_polygon_fence, a step): it now lies across the track and
      blocks the route ahead of the aircraft. Before the rotation nothing may
      bind; after it the aircraft must be held out of the bar.
    mission:
      start_pose: { x: -200.0, y: 0.0, up: 15.0 }
      target: { x: -80.0, y: 0.0, up: 15.0 }
      pilot: { type: goto, speed: 4.0 }
    policy: { path: policies/sim_demo_policy.yaml }
    events:
      - at_sim_t: 3.0
        type: spawn_polygon_fence
        payload:
          id: bar
          vertices: [{ x: -165.0, y: 13.0 }, { x: -125.0, y: 13.0 },
                     { x: -125.0, y: 17.0 }, { x: -165.0, y: 17.0 }]
      - at_sim_t: 8.0
        type: rotate_polygon_fence
        payload: { id: bar, angle_deg: 90.0 }
    expected_kpis:
      P0_escape_rate: 0
      phase1_violation_ticks_bar: { max: 0 }          # beside the route: inert
      phase2_violation_ticks_bar: { min: 1 }          # across it: binding
      time_to_safe_episodes: { max: 0 }
      breaches: { max: 0 }
      polygon_entries: { max: 0 }
    expected_failsafe: false

  - scenario_id: dyn-nfz-rotate-spin
    template: dynamic_nfz_movement
    description: >
      The same bar, spinning: spawned across the route 25 m ahead of the
      aircraft at 3 s and turning about its centre at `deg_per_s`
      (rotate_polygon_fence with a yaw rate), so it opens and closes the
      route. The Shield forecasts the rotation; the aircraft must never fly
      itself into the bar. Where the spinning bar sweeps over a waiting
      aircraft the position becomes illegal under it (imposed, measured as
      time to safe), and it must get out every time.
      At the grant's 5 s forecast (2026-10-12) the bar never reaches the
      waiting aircraft: the Shield forecasts 15-30 degrees of rotation instead
      of 9-18, its first brake comes 2 s earlier (3.4 s against 5.4 s), and the
      aircraft waits clear of the sweep (closest 1.04 m at 3 deg/s and 1.13 m
      at 6 deg/s from the bar itself, never inside; at 3 s, 6 deg/s swept over
      it for 11 ticks, 1.84 m deep). Bars of 50 and 56 m (measured the same
      day) do not change that. The 6 deg/s pin (below until 2026-10-12) came
      off: at 5 s the cell takes G1, G2, then G8 (Loiter cleared) and G7,
      and completes. So that the imposed half is still flown here (the
      review of 2026-10-12: with 3 and 6 deg/s alone the time-to-safe gate
      passed on nothing), 9 deg/s was added: there the sweep does come over
      the waiting aircraft (inside the bar's ring at 8.3 s, 0.94 m from the
      bar; time to safe 5.1 s, never censored), and it flies the old 6 deg/s
      chain - pinned below. 12 deg/s and faster were measured and not added:
      at 12 the harness counts one breach (a move of the aircraft's own onto
      a spot the sweep had already made unsafe), at 18 and 24 the forecast
      exceeds theta (X1) and the Loiter timeout (G5) sends it home.
    mission:
      start_pose: { x: -200.0, y: 0.0, up: 15.0 }
      target: { x: -80.0, y: 0.0, up: 15.0 }
      pilot: { type: goto, speed: 4.0 }
    policy: { path: policies/sim_demo_policy.yaml }
    events:
      - at_sim_t: 3.0
        type: spawn_polygon_fence
        payload: { id: bar, width_m: 40, height_m: 4, ahead_of_vehicle_m: 25,
                   anchor: center }
      - at_sim_t: 3.0
        type: rotate_polygon_fence
        payload: { id: bar, deg_per_s: "$deg_per_s" }
    ticks: 400
    parameter_sweep:
      deg_per_s: [3, 6, 9]
    expected_kpis:
      P0_escape_rate: 0
      time_to_safe_censored: { max: 0 }
      breaches: { max: 0 }
      polygon_entries: { max: 0 }
    expected_failsafe: false
    known_failures:
      - params: { deg_per_s: 9 }
        description: >
          False fail-safe through N-in-T, then X6 (measured 2026-10-12 at the
          grant's 5 s forecast): the bar sweeping past the waiting aircraft
          makes the violation flicker, three onsets inside T = 5 s hand it to
          LOITER (G2, 6.3 s), and ArduPilot's position hold keeps it where
          the next sweep comes over it at 8.3 s (inside the ring, never the
          polygon; 50 P0 ticks of LOITER); the stop stays illegal for T and
          X6 sends it home (RTL 13.3 s, home 16.3 s). The FSM's question
          (a hold that the next sweep makes illegal), not this harness's.
          On the 3 s comparison arm: G1>G2>X7>G9, 15 ticks inside, 1.94 m
          deep.
    # The 6 deg/s pin, as written on 2026-10-07 and removed on 2026-10-12
    # (it passes at the grant's 5 s forecast; see the description):
    #   False fail-safe through N-in-T, then X6: the bar sweeping past the
    #   waiting aircraft makes the violation flicker, three onsets inside
    #   T = 5 s hand it to LOITER (G2), and ArduPilot's position hold keeps it
    #   where the next sweep of the bar comes over it; X6 (later X7) sends it
    #   home. On the 3 s comparison arm it still does (G1>G2>X7>G9).
