# Scenario library - template `sensor_degradation`: Safety Shield test matrix: GPS noise / latency, and GPS denial.
# An extension template (guardrail/scenario_spec.py, EXTENSION_TEMPLATES).
#
# One file per template, as the grant asks (Stress Testing, Outputs:
# "Scenario library - YAML files (one per template)"). Listed by
# experiments/scenarios.yaml and validated at load by
# guardrail/scenario_spec.py (ScenarioSpec); a family here must carry this
# file's template. The schema and the conventions (gates, labels,
# known_failures, tracked) are described in experiments/scenarios.yaml.

template: sensor_degradation

scenarios:
  # ---- Shield matrix: "GPS noise / latency" ------------------------------ #
  - scenario_id: gps-noise-within-margin
    template: sensor_degradation
    description: >
      Stability under sensor degradation, inside the error budget the 1 m
      margin was sized for: white position noise of 0.2-0.3 m (3 sigma under
      0.9 m) and up to 2 ticks of state latency (0.8 m stale at 4 m/s). The
      target line runs INSIDE the margin ring (0.4-0.8 m from the zone), so the
      aircraft slides along the ring pressing in - the configuration where
      noise matters. A line parallel to the edge outside the ring was measured
      insensitive to 2 m noise, and a line inside the zone itself meets its
      face head-on and wedges, so neither tests anything here.
      The polygon itself must never be entered. The Shield's own escape count
      is the grant's; true-state violations are reported beside it.

      Pins re-measured 2026-10-12 on the shipped default. Since the FSM
      counts at most one onset per second (onset limit, 2026-10-09) these
      cells pass on every seed measured (library 0, nightly 1001-1003) and
      their known-failure pins were removed: latency 0 / pass_y 23.2 /
      sigma 0.2 (every seed); latency 0 / 23.6 / 0.2 (seed 0); latency 1 /
      23.2 / 0.2 (1002); latency 2 / 23.2 / 0.3 (1003); latency 2 / 23.6 /
      0.3 (1002). Three pins that named every seed now name only the seeds
      where the cell still fails: latency 0 / 23.2 / 0.3 passes on seeds 0
      and 1003, latency 0 / 23.6 / 0.3 on 0, 1001 and 1003, and latency 1 /
      23.2 / 0.3 on 1001-1003. With the onset limit at 0 s (every return
      counts) every one of those cells fails again, on every seed measured
      (2026-10-12, the library and the nightly profile). The
      limit is the PI's question 11 (docs/DESIGN-escalation-fsm.md,
      Questions for the PI): if the PI picks 0 s, the pins come back.
      At the grant's 5 s forecast (later on 2026-10-12) the seeds that
      flicker moved again: only latency 0 / 23.2 / 0.3 fails, on 1001 and
      1003; the comment above known_failures lists what came off.
    mission:
      start_pose: { x: -30.0, y: "$pass_y", up: 15.0 }
      target: { x: 60.0, y: "$pass_y", up: 15.0 }
      pilot: { type: goto, speed: 4.0 }
    policy: { path: policies/sim_demo_policy.yaml }
    ticks: 400
    stress: { gps_noise_m: "$sigma", latency_ticks: "$latency" }
    parameter_sweep:
      pass_y: [23.2, 23.6]
      sigma: [0.2, 0.3]
      latency: [0, 1, 2]
    expected_kpis:
      P0_escape_rate: 0
      all_actions_finite: { equals: true }
      min_true_dist_to_fence_m: { min: 0.0 }
      reached_goal: { equals: true }
    expected_outcome: success
    expected_failsafe: false
    known_failures:
      # Re-measured 2026-10-12 on the shipped default (N-in-T onset limit
      # 1 s), library seed 0 and nightly seeds 1001-1003: each pin below still
      # fails on the seed it names and passes on the others. Five pins that
      # passed on every seed measured were removed then, and three that named
      # every seed were narrowed to the seeds where the cell still fails (see
      # the description).
      # Re-measured again later that day at the grant's 5 s forecast (library
      # seed 0, nightly 1001-1003): the flicker moved. latency 0 / 23.2 / 0.3
      # still fails on 1001 (G1>G2>G4>G9) and now also on 1003 (G1>G2>G4>G9,
      # pinned); four pins pass on their seed and came off: latency 1 / 23.2
      # / 0.3 on 0, latency 0 / 23.2 / 0.3 on 1002, latency 0 / 23.6 / 0.3 on
      # 1002 and latency 1 / 23.6 / 0.3 on 1002. Which seeds flicker depends
      # on where the forecast's poses meet the ring under the noise, so it
      # moves with the forecast.
      - params: { latency: 0, pass_y: 23.2, sigma: 0.3, random_seed: 1001 }
        description: &noiseflicker >
          False fail-safe through N-in-T under sensor noise (measured
          2026-10-07): sliding along the margin ring with 0.2-0.3 m of position
          noise, the Shield's violation of the ring switches on and off with
          the noise; three onsets inside T = 5 s count as N-in-T (G2: Brake ->
          Loiter), and in Loiter, with the pilot still pressing, new onsets
          keep arriving and N-in-T persists (G4): RTL. The polygon is never
          entered and the Shield's own count stays clean; the FSM counts noise
          as violations. Where it shows on some seeds only, the pin names the
          seed (0 is the library run's, 1001-1003 the nightly profile's).
      - params: { latency: 0, pass_y: 23.2, sigma: 0.3, random_seed: 1003 }
        description: *noiseflicker

  - scenario_id: gps-noise-beyond-margin
    template: sensor_degradation
    expect: tracked
    description: >
      Beyond the budget, TRACKED rather than gated: 1-2 m noise and 5-10 ticks
      (0.5-1 s) of latency against a 1 m margin. The margin cannot absorb this
      by construction, so polygon entries here are a measurement of how far
      past its design point the Shield degrades, reported in the family table
      (breaches, polygon ticks, closest approach) - not hidden behind a gate it
      was never expected to pass. Gated only on what must hold whatever the
      sensor does: the Shield never emits an action it has itself found
      illegal, and never a non-finite one.
    mission:
      start_pose: { x: -30.0, y: "$pass_y", up: 15.0 }
      target: { x: 60.0, y: "$pass_y", up: 15.0 }
      pilot: { type: goto, speed: 4.0 }
    policy: { path: policies/sim_demo_policy.yaml }
    ticks: 400
    stress: { gps_noise_m: "$sigma", latency_ticks: "$latency" }
    parameter_sweep:
      pass_y: [23.2, 23.6]
      sigma: [1.0, 2.0]
      latency: [5, 10]
    expected_kpis:
      P0_escape_rate: 0
      all_actions_finite: { equals: true }
    expected_failsafe: false

  # ---- GPS denial (audit card X-14; reference design L2 "GPS denial") ----- #
  - scenario_id: gps-dropout
    template: sensor_degradation
    expect: tracked
    description: >
      TRACKED: GPS denial as a headless run can model it. For the window the
      Shield is handed the LAST FIX, frozen, while the aircraft keeps flying -
      what a bridge that forwards the last pose would do. The Shield's State
      has no fix-quality field, so it cannot know the pose is stale, and the
      grant names no Shield response to GPS loss. Measured 2026-10-06 on the
      head-on lane, at the 3 s forecast flown then: frozen while parked at the
      lookahead edge (6-11 s), the Shield keeps permitting the ~3.9 m/s it
      would allow from 11.6 m out and the aircraft ends 7 m inside the
      polygon; a 2-4 s window at 2 s never reaches it.
      RE-CUT 2026-10-12 for the grant's 5 s forecast. The long windows were
      5 s, the old lookahead plus 2 s, starting at 2, 4 and 6 s; at 5 s the
      Shield brakes the head-on lane 20.6 m out by 5 s, so a dropout from
      6 s froze a pose it was already holding and changed nothing (no
      entry). The long windows are now the new lookahead plus 2 s (7 s),
      from 2, 4 and 6 s: frozen at 4 s, still at 4 m/s about 24 m out, the
      Shield keeps permitting 4 m/s for 7 s and the aircraft ends 7 m inside
      the polygon (4-11 s, the cell the finding is pinned on); from 2 s it
      stops on the ring (1.0 m from the polygon), and from 6 s it is
      already held and nothing changes (20.6 m). The 2-4 s window still
      never reaches it. On the edge lane (23.6) no window enters. Gated only on what must hold whatever the sensor does - the
      Shield never emits an action it has itself found illegal, never a
      non-finite one - and on the dropout having actually frozen the pose
      (a window that froze nothing would otherwise pass as a clean run).
      Unlabelled: with no fix-status input there is no defensible fail-safe
      expectation to write down.
    mission:
      start_pose: { x: -30.0, y: "$lane_y", up: 15.0 }
      target: { x: 60.0, y: "$lane_y", up: 15.0 }
      pilot: { type: goto, speed: 4.0 }
    policy: { path: policies/sim_demo_policy.yaml }
    ticks: 400
    stress: { gps_dropout_s: "$window" }
    parameter_sweep:
      lane_y: [15.0, 23.6]
      window: [[2.0, 4.0], [2.0, 9.0], [4.0, 11.0], [6.0, 13.0]]
    expected_kpis:
      P0_escape_rate: 0
      all_actions_finite: { equals: true }
      gps_dropout_ticks: { min: 1 }
