# Scenario library - template `failsafe_escalation`: rules whose breach action hands the aircraft to the autopilot (RTL / Land), through the escalation FSM.
# An extension template (guardrail/scenario_spec.py, EXTENSION_TEMPLATES).
#
# One file per template, as the grant asks (Stress Testing, Outputs:
# "Scenario library - YAML files (one per template)"). Listed by
# experiments/scenarios.yaml and validated at load by
# guardrail/scenario_spec.py (ScenarioSpec); a family here must carry this
# file's template. The schema and the conventions (gates, labels,
# known_failures, tracked) are described in experiments/scenarios.yaml.
#
# WHY THIS TEMPLATE EXISTS (2026-10-07)
#
# "Fail-safe trigger correctness - triggered when expected, not when not
# expected" (Stress Testing, acceptance KPIs, >= 99 %) needs both kinds of
# label, or one of its two nulls ties it whatever the Shield does
# (guardrail.fsm.score_failsafe_triggers: `discriminating`). Until this file
# every family but one was labelled "not expected". Here a zone is spawned
# with a breach action that the grant's FSM answers by handing the aircraft
# over (Policy DSL: `violation_action` loiter / RTL / land; Safety Shield
# FSM: Normal -> RTL / Land directly, G11 / G12, and Loiter -> RTL on the
# operator timeout, G5), and the autopilot model in
# experiments/sweep_scenarios.py flies the mode.

template: failsafe_escalation

scenarios:
  - scenario_id: failsafe-rtl-zone
    template: failsafe_escalation
    description: >
      A zone whose breach action is RTL is hot-applied `ahead_m` in front of
      the aircraft at 3 s. The Shield does not project around it: the rule
      asks for RTL, so it stops where a stop is legal and the escalation FSM
      goes straight to RTL (edge G11). The autopilot's RTL flies home, behind
      the aircraft, away from the zone. Labelled RTL_triggered with a
      fail-safe expected; the aircraft must never enter the zone.
    mission:
      start_pose: { x: -200.0, y: 0.0, up: 15.0 }
      target: { x: -80.0, y: 0.0, up: 15.0 }
      pilot: { type: goto, speed: 4.0 }
      rotate_deg: "$approach_deg"
    policy: { path: policies/sim_demo_policy.yaml }
    events:
      - at_sim_t: 3.0
        type: spawn_polygon_fence
        payload: { id: rtl-zone, width_m: 30, height_m: 20,
                   ahead_of_vehicle_m: "$ahead_m", violation_action: RTL }
    parameter_sweep:
      ahead_m: [6, 12]
    parameter_sample:
      approach_deg: { uniform: [0, 360] }
    expected_kpis:
      P0_escape_rate: 0
      breaches: { max: 0 }
      polygon_entries: { max: 0 }
    expected_outcome: RTL_triggered
    expected_failsafe: true
    failsafe_clause: E1

  - scenario_id: failsafe-land-zone
    template: failsafe_escalation
    description: >
      The same, with breach action `land`: the FSM goes straight to Land
      (G12) and the autopilot descends at 0.5 m/s until it is down (G10, the
      episode ends). The descent takes the aircraft below the demo policy's
      10 m floor: those ticks are the AUTOPILOT's, left out of the Shield's own
      escape count and counted in `true_p0_flown_ticks` (the true-state
      record), so a reader sees the floor broken by the landing rather than
      a clean figure. Labelled Land_triggered with a fail-safe expected.
      WHY ITS LABEL ACCEPTS P0 TICKS UNDER THE AUTOPILOT: a landing ends below
      any altitude floor by definition, so every LAND tick whose forecast
      crosses the 10 m floor is a P0 tick the autopilot flew
      (`autopilot_p0_flown_ticks_by_mode` LAND, 249 of 300 at the grant's 5 s
      forecast; 229 at 3 s, where the forecast saw the floor later). The
      rule asked for the landing; the floor cannot hold under it.
    mission:
      start_pose: { x: -200.0, y: 0.0, up: 15.0 }
      target: { x: -80.0, y: 0.0, up: 15.0 }
      pilot: { type: goto, speed: 4.0 }
    policy: { path: policies/sim_demo_policy.yaml }
    events:
      - at_sim_t: 3.0
        type: spawn_polygon_fence
        payload: { id: land-zone, width_m: 30, height_m: 20,
                   ahead_of_vehicle_m: 12, violation_action: land }
    ticks: 400
    expected_kpis:
      P0_escape_rate: 0
      breaches: { max: 0 }
      polygon_entries: { max: 0 }
    expected_outcome: Land_triggered
    expected_failsafe: true
    failsafe_clause: E1

  - scenario_id: failsafe-loiter-timeout
    template: failsafe_escalation
    description: >
      Breach action `loiter`: the FSM goes to Loiter directly (X4) and the
      autopilot holds position, while the pilot keeps asking to fly into the
      zone, so the hard rule is never clear for T_recover. After the
      operator-defined Loiter timeout (30 s, fsm.FSMConfig) the FSM sends the
      aircraft home (G5). Labelled RTL_triggered with a fail-safe expected:
      the fail-safe here is reached through the timeout, not a direct action.
    mission:
      start_pose: { x: -200.0, y: 0.0, up: 15.0 }
      target: { x: -80.0, y: 0.0, up: 15.0 }
      pilot: { type: goto, speed: 4.0 }
    policy: { path: policies/sim_demo_policy.yaml }
    events:
      - at_sim_t: 3.0
        type: spawn_polygon_fence
        payload: { id: loiter-zone, width_m: 30, height_m: 20,
                   ahead_of_vehicle_m: 12, violation_action: loiter }
    ticks: 500
    expected_kpis:
      P0_escape_rate: 0
      breaches: { max: 0 }
      polygon_entries: { max: 0 }
    expected_outcome: RTL_triggered
    expected_failsafe: true
    failsafe_clause: E5

  # ---- the hand-over made answerable to P0 (2026-10-12) ------------------ #
  # The FSM's RTL -> Land edge, "RTL fails (battery / blocked path)" (Safety
  # Shield p4, G6), had no input until guardrail/rtl_path.py: the harness
  # never passed rtl_failed, so these two cells would have flown RTL home
  # through the zone and on a flat battery.
  - scenario_id: failsafe-rtl-blocked
    template: failsafe_escalation
    description: >
      The way home is blocked. At 4 s a zone is hot-applied BEHIND the
      aircraft, across the line between it and the launch point; at 5 s a
      zone whose breach action is RTL appears 12 m ahead, so the FSM goes
      straight to RTL (G11). ArduPilot's RTL would fly the straight leg home
      at 15 m through the first zone. guardrail/rtl_path.py tests that leg
      against every P0 zone in force on the first RTL tick, reports it
      blocked, and the FSM takes the grant's RTL -> Land edge (G6, "RTL fails
      (battery / blocked path)"), then lands where it is (G10). Labelled
      Land_triggered with a fail-safe expected; the autopilot must never
      enter either zone. WHY ITS LABEL ACCEPTS P0 TICKS UNDER THE AUTOPILOT:
      the landing goes through the demo policy's 10 m floor, as in
      failsafe-land-zone, so the LAND ticks whose forecast crosses it are P0
      ticks the autopilot flew. Whether the FSM should hold instead of
      landing when the way home is blocked is the FSM's question (it lands,
      as the grant's diagram draws it).
    mission:
      start_pose: { x: -200.0, y: 0.0, up: 15.0 }
      target: { x: -80.0, y: 0.0, up: 15.0 }
      pilot: { type: goto, speed: 4.0 }
    policy: { path: policies/sim_demo_policy.yaml }
    events:
      - at_sim_t: 4.0
        type: spawn_polygon_fence
        payload:
          id: home-side-zone
          vertices: [{ x: -196.0, y: -10.0 }, { x: -190.0, y: -10.0 },
                     { x: -190.0, y: 10.0 }, { x: -196.0, y: 10.0 }]
      - at_sim_t: 5.0
        type: spawn_polygon_fence
        payload: { id: rtl-zone, width_m: 30, height_m: 20,
                   ahead_of_vehicle_m: 12, violation_action: RTL }
    ticks: 420
    expected_kpis:
      P0_escape_rate: 0
      breaches: { max: 0 }
      polygon_entries: { max: 0 }
      autopilot_polygon_entries: { max: 0 }
      rtl_failed_ticks: { min: 1 }
    expected_outcome: Land_triggered
    expected_failsafe: true
    failsafe_clause: E1

  - scenario_id: failsafe-low-battery
    template: failsafe_escalation
    description: >
      The battery goes critical during the RTL. A zone whose breach action is
      RTL appears 12 m ahead at 10 s; the FSM goes to RTL (G11) and the
      autopilot flies home, 40 m behind. At 14 s, halfway home, the battery
      reports critical (stress.battery_critical_at_s, the battery hook of
      guardrail/rtl_path.py): the RTL in progress fails and the FSM takes the
      grant's RTL -> Land edge (G6), then lands where it is (G10). With no
      critical battery the same flight reaches home (G9). Labelled
      Land_triggered with a fail-safe expected; never inside either zone.
      WHY ITS LABEL ACCEPTS P0 TICKS UNDER THE AUTOPILOT: the LAND descent
      goes through the demo policy's 10 m floor (see failsafe-land-zone), so
      its ticks whose forecast crosses the floor are P0 ticks the autopilot
      flew.
    mission:
      start_pose: { x: -200.0, y: 0.0, up: 15.0 }
      target: { x: -80.0, y: 0.0, up: 15.0 }
      pilot: { type: goto, speed: 4.0 }
    policy: { path: policies/sim_demo_policy.yaml }
    events:
      - at_sim_t: 10.0
        type: spawn_polygon_fence
        payload: { id: rtl-zone, width_m: 30, height_m: 20,
                   ahead_of_vehicle_m: 12, violation_action: RTL }
    stress: { battery_critical_at_s: 14.0 }
    ticks: 500
    expected_kpis:
      P0_escape_rate: 0
      breaches: { max: 0 }
      polygon_entries: { max: 0 }
      autopilot_polygon_entries: { max: 0 }
      rtl_failed_ticks: { min: 1 }
    expected_outcome: Land_triggered
    expected_failsafe: true
    failsafe_clause: E1

  # ---- the FSM's edges the rails had never taken (2026-11-14) ------------- #
  # The KPI-grade hil nightly ntFIN2 (13 Nov) took neither the FSM's X2 / X3
  # (Brake / Loiter -> RTL / Land on a direct rule) nor the grant's N-in-T
  # edges G2 / G4, and no library cell asks for them on a rail: every RTL or
  # land rule in the library is violated from Normal (G11 / G12), and the
  # only cells that take G2 / G4 headless do it through GPS noise (refused on
  # the rails) or a forecast flickering at a ring on the ideal vehicle, which
  # the rig's own response does not flicker. These three cells take them on
  # purpose. They are flown only by experiments/profiles/fsm_edges.yaml
  # (`profiles`): no library run, smoke, nightly or broad profile flies them,
  # so no published number moves.
  - scenario_id: failsafe-rtl-from-hold
    template: failsafe_escalation
    profiles: [fsm_edges]
    description: >
      X2 (Brake / Loiter -> RTL on a violated RTL rule). nfz-head-on's flight:
      the pilot flies straight at nfz-square and keeps asking to fly through
      it, so the Shield holds the aircraft short of it - Brake on a trusted
      repair on the ideal vehicle (G1 at 1.6 s), Loiter on an untrusted one on
      the rail vehicle (G1 2.8 s, G3 3.3 s), never back to Normal while the
      request keeps pressing. At 8 s a zone whose breach action is RTL is
      hot-applied over nfz-square's own footprint (7-23 m North and East, the
      same ring), so the request that was being repaired now violates an RTL
      rule, and the FSM goes home from the state it is in: X2 at 8.0 s on
      both vehicles, then home behind the aircraft (G9). The zone is placed
      on the ground the request is already pressing into, so the edge does
      not depend on where the rig's hold stopped. Labelled RTL_triggered
      with a fail-safe expected (E1, the RTL rule demands it); the aircraft
      must never enter either zone.
    mission:
      start_pose: { x: -20.0, y: 15.0, up: 15.0 }
      target: { x: 40.0, y: 15.0, up: 15.0 }
      pilot: { type: goto, speed: 4.0 }
    policy: { path: policies/sim_demo_policy.yaml }
    events:
      - at_sim_t: 8.0
        type: spawn_polygon_fence
        payload:
          id: rtl-core
          violation_action: RTL
          vertices: [{ x: 7.0, y: 7.0 }, { x: 23.0, y: 7.0 },
                     { x: 23.0, y: 23.0 }, { x: 7.0, y: 23.0 }]
    ticks: 400
    expected_kpis:
      P0_escape_rate: 0
      breaches: { max: 0 }
      polygon_entries: { max: 0 }
      autopilot_polygon_entries: { max: 0 }
    expected_outcome: RTL_triggered
    expected_failsafe: true
    failsafe_clause: E1

  - scenario_id: failsafe-land-from-hold
    template: failsafe_escalation
    profiles: [fsm_edges]
    description: >
      X3 (Brake / Loiter -> Land on a violated land rule): the flight of
      failsafe-rtl-from-hold with breach action `land`. X3 at 8.0 s on both
      vehicles, then the autopilot descends where the Shield held the
      aircraft, short of nfz-square, until it is down (G10, 38.0 s ideal,
      38.6 s rail). Labelled Land_triggered with a fail-safe expected (E1).
      WHY ITS LABEL ACCEPTS P0 TICKS UNDER THE AUTOPILOT: the LAND descent
      goes through the demo policy's 10 m floor, as in failsafe-land-zone,
      so its LAND ticks whose forecast crosses the floor are P0 ticks the
      autopilot flew; no zone is entered.
    mission:
      start_pose: { x: -20.0, y: 15.0, up: 15.0 }
      target: { x: 40.0, y: 15.0, up: 15.0 }
      pilot: { type: goto, speed: 4.0 }
    policy: { path: policies/sim_demo_policy.yaml }
    events:
      - at_sim_t: 8.0
        type: spawn_polygon_fence
        payload:
          id: land-core
          violation_action: land
          vertices: [{ x: 7.0, y: 7.0 }, { x: 23.0, y: 7.0 },
                     { x: 23.0, y: 23.0 }, { x: 7.0, y: 23.0 }]
    ticks: 450
    expected_kpis:
      P0_escape_rate: 0
      breaches: { max: 0 }
      polygon_entries: { max: 0 }
      autopilot_polygon_entries: { max: 0 }
    expected_outcome: Land_triggered
    expected_failsafe: true
    failsafe_clause: E1

  - scenario_id: fsm-n-in-t-flicker
    template: failsafe_escalation
    profiles: [fsm_edges]
    description: >
      The grant's N-in-T edges, G2 (Brake -> Loiter, "N-in-T threshold") and
      G4 (Loiter -> RTL, "N-in-T persists"). N-in-T counts ONSETS of a hard
      violation, at most one per second (fsm.ONSET_CLEAR_S), three in 5 s;
      a steady pilot on the rig's smooth response makes one onset and holds
      it, so here the world makes them: a hard zone whose breach action is
      `brake` is hot-applied 16 m ahead at 3 s and then switched off and on
      again (deactivate_rule / activate_rule, a time-window switch each)
      every 1.4 s, the pilot asking to fly into it throughout. Each switch-on
      is an onset; a brake rule is answered by its own stop where a stop is
      legal, so no onset is an untrusted repair (no G3), and each switch-off
      lasts 0.9 s, under T_recover, so neither Brake nor Loiter clears in
      between. Onsets at 3.0 s (Normal -> Brake, X1: the rule asks for
      brake), 4.4 s and 5.8 s (three in 2.8 s: G2), then 7.2, 8.6 and 10.0 s
      inside the Loiter (G4, the onsets that caused the Loiter cleared on
      entry), then home behind the aircraft (G9), on the ideal and the rail
      vehicle alike; 1.4 s apart, each onset survives 0.4 s of tick jitter
      against the 1 s rate limit. Labelled with a fail-safe expected (E6,
      "N-in-T persists": the grant's G4) SINCE 2026-11-15; no outcome label.
      Until then the cell carried no fail-safe label, on purpose: the
      rubric (docs/RUBRIC-failsafe.md) expects none for a planner whose
      every request is answered by a stop or a trusted repair (N1), while
      the grant's G4 sends a Loiter whose N-in-T persists home. Decided
      2026-11-15 by the lab under the PI's instruction of 6 Oct (follow the
      grant; best practice where it is silent), the PI's confirmation still
      to be recorded: the grant's G4 governs a thrash of onsets the world
      makes, as the rubric's clause E6 (its section 9). The label FOLLOWED
      the flight: hs10_003 flew these edges on the hil rig on 14 November
      (X1, G2, G4, G9), before the clause existed; the grant's text is the
      basis, not that run. Still flown by the fsm_edges profile alone
      (grant_kpi_bearing false): no KPI campaign's number moves.
    mission:
      start_pose: { x: -200.0, y: 0.0, up: 15.0 }
      target: { x: -80.0, y: 0.0, up: 15.0 }
      pilot: { type: goto, speed: 4.0 }
    policy: { path: policies/sim_demo_policy.yaml }
    events:
      - at_sim_t: 3.0
        type: spawn_polygon_fence
        payload: { id: flicker-zone, width_m: 30, height_m: 20,
                   ahead_of_vehicle_m: 16, violation_action: brake }
      - { at_sim_t: 3.5, type: deactivate_rule, payload: { rule_id: flicker-zone } }
      - { at_sim_t: 4.4, type: activate_rule, payload: { rule_id: flicker-zone } }
      - { at_sim_t: 4.9, type: deactivate_rule, payload: { rule_id: flicker-zone } }
      - { at_sim_t: 5.8, type: activate_rule, payload: { rule_id: flicker-zone } }
      - { at_sim_t: 6.3, type: deactivate_rule, payload: { rule_id: flicker-zone } }
      - { at_sim_t: 7.2, type: activate_rule, payload: { rule_id: flicker-zone } }
      - { at_sim_t: 7.7, type: deactivate_rule, payload: { rule_id: flicker-zone } }
      - { at_sim_t: 8.6, type: activate_rule, payload: { rule_id: flicker-zone } }
      - { at_sim_t: 9.1, type: deactivate_rule, payload: { rule_id: flicker-zone } }
      - { at_sim_t: 10.0, type: activate_rule, payload: { rule_id: flicker-zone } }
    ticks: 300
    expected_kpis:
      P0_escape_rate: 0
      breaches: { max: 0 }
      polygon_entries: { max: 0 }
      autopilot_polygon_entries: { max: 0 }
    expected_failsafe: true
    failsafe_clause: E6
