# Scenario library - template `subject_standoff`: range from a declared subject, per class.
# An extension template (guardrail/scenario_spec.py, EXTENSION_TEMPLATES).
#
# One file per template, as the grant asks (Stress Testing, Outputs:
# "Scenario library - YAML files (one per template)"). Listed by
# experiments/scenarios.yaml and validated at load by
# guardrail/scenario_spec.py (ScenarioSpec); a family here must carry this
# file's template. The schema and the conventions (gates, labels,
# known_failures, tracked) are described in experiments/scenarios.yaml.

template: subject_standoff

scenarios:
  # ---- subject stand-off ------------------------------------------------- #
  - scenario_id: standoff-approach
    template: subject_standoff
    description: >
      Flown at a declared pedestrian who is NOT on the route. The 10 m ring must
      hold and the mission must still finish.
    mission:
      start_pose: { x: 0.0, y: 0.0, up: 15.0 }
      target: { x: 40.0, y: 0.0, up: 15.0 }
      pilot: { type: goto, speed: 4.0 }
      subject: { x: 20.0, y: 14.0, class: pedestrian }
    policy: { path: policies/sitl_pedestrian.yaml }
    shield: true
    expected_kpis:
      p0_violation_escape_rate: { max: 0.0 }
      min_range_to_subject: { min: 9.99 }
      reached_goal: { equals: true }
    expected_outcome: success
    expected_failsafe: false
    failsafe_clause: N1

  - scenario_id: standoff-reclassified
    template: subject_standoff
    description: >
      Was a KNOWN FAILURE from 2026-10-07 to 2026-10-09: a FALSE fail-safe
      through edge X6. When the label flips at 10 s the aircraft is inside the
      new 10 m ring (imposed); StandoffRecover pushes it out against a pilot
      still pulling in and was 0.15 m short when the position had been
      illegal for T = 5 s, and X6, which tested duration only, sent the
      aircraft to RTL (labels: outcome fail and no fail-safe expected; flew
      RTL_triggered). Since X6's progress test (2026-10-09) the recovery is
      left alone: G1 then G3, out in 5.4 s, held at 10.03 m from the subject,
      no fail-safe. Re-measured 2026-10-11 on both theta readings and both
      onset limits; the marker was removed then.

      THE ANSWER TO THE 2026-09-02 REVIEW, made measurable.

      Prof. Lai's point was fair: BoT-SORT and ByteTrack associate detections
      across frames better than we do, so "we track well" is not a claim worth
      making. But a tracker must be given a BOX and cannot be given a NOUN. It
      returns an ID; it never returns a CLASS.

      The stand-off rule is written per class - 10 m from a pedestrian, 5 m from
      anything else - so the policy needs to know the subject IS a person before
      it can pick the rule. That is not a tracking-quality contest the
      open-vocabulary detector might lose; it is a question a tracker cannot be
      asked at all.

      Here one object never moves and the policy is never edited. Only the class
      word attached to it changes, twelve seconds in, and the enforced ring goes
      from 5 m to 10 m. Both rules come from policies/sitl_pedestrian.yaml
      exactly as it already shipped - nothing was added for this scenario, which
      is the point: the capability was in the schema the whole time.

      WHY ITS LABEL ACCEPTS P0 TICKS UNDER THE AUTOPILOT (2026-11-02): the
      Loiter timeout's RTL (rubric E5) flies straight home past the
      pedestrian, its forecast inside the 10 m ring on 4 RTL ticks, and the
      aircraft passes inside the ring once (an autopilot breach): the modelled
      RTL, like ArduPilot's, knows nothing of a stand-off, and
      guardrail/rtl_path.py judges zones and the band only.
    mission:
      start_pose: { x: 0.0, y: 0.0, up: 15.0 }
      # The pilot's goal sits 6 m from the subject and it NEVER changes its mind.
      # That is deliberate: once parked there it keeps asking to stay, so holding
      # the aircraft out afterwards is the Shield working against a pilot that is
      # still pulling in - not the mission conveniently wandering off.
      target: { x: 22.0, y: 0.0, up: 15.0 }
      pilot: { type: goto, speed: 4.0 }
      subject:
        x: 22.0
        y: 6.0
        class: car
        reclassify:
          - { at_s: 10.0, class: pedestrian }
    policy: { path: policies/sitl_pedestrian.yaml }
    # 50 s (2026-11-02, docs/RUBRIC-failsafe.md section 3): long enough to
    # show the fail-safe outcome. Shorter, the run ended while the FSM held
    # in Loiter with its 30 s operator timeout still running, or while the
    # planner's unsafe request (rubric E5) was still running - and the
    # cell scored as a correct non-trigger it had not shown.
    ticks: 500   # was 400
    shield: true
    expected_kpis:
      p0_violation_escape_rate: { max: 0.0 }
      # While labelled a car only the 5 m rule binds, so 6 m is legal and the
      # aircraft must actually GO there. Without this the scenario would pass on
      # a flight that never approached, demonstrating nothing - the same
      # reasoning that makes nfz-head-on-control gated to fail.
      min_range_as_car: { max: 9.99 }
      # It was inside 10 m when the label flipped: the rule changed under it.
      range_at_reclassify: { max: 9.99 }
      # And it recovered, against a pilot still asking to close.
      final_range_to_subject: { min: 9.99 }
      # The Shield had to act. Zero repairs would mean the range changed for
      # some other reason.
      repair_count: { min: 1 }
      subject_class_final: { equals: pedestrian }
    # The goal is inside the 10 m ring once the label flips, so NOT reaching it
    # is the rule working: an arrival would be the breach.
    expected_outcome: RTL_triggered   # was fail: the fail-safe it expects (E5) ends in RTL
    # Fail-safe label by the rubric (docs/RUBRIC-failsafe.md, 2026-11-02): E5 - flown without a fail-safe, once the subject is a pedestrian the pilot's request into its ring is over theta for 33.4 s (>= 30.1 s). Was: false.
    expected_failsafe: true
    failsafe_clause: E5

  - scenario_id: standoff-wedge
    template: subject_standoff
    expect: known_failure
    # What the wedge fails, measured 2026-10-19 on the smoke run and all three
    # nightly seeds (f93283d): the goal and the outcome label. The P0 gate and
    # the 10 m ring are not pinned - an escape or a closer pass is new. Since
    # 2026-11-02 the outcome label is the rubric's (RTL_triggered, E5: the
    # pilot asks through the ring for the whole run) and the FSM's Loiter
    # timeout meets it, so only the goal is pinned.
    known_failure_fails: [reached_goal]
    description: >
      THE OPEN DEFECT, pinned here so it stops living only in a document.
      The subject sits exactly on the route, so every direction that makes
      progress also closes the range. The Shield never emits an illegal action -
      the P0 gate holds - but the mission wedges: the aircraft cannot get past
      the subject and never reaches its goal. Recorded on 2026-08-31 as the gap
      between "the action was repaired" and "the trajectory was sensible".
      When this scenario starts PASSING, the defect is fixed and the marker
      should come off.
    mission:
      start_pose: { x: 0.0, y: 0.0, up: 15.0 }
      target: { x: 40.0, y: 0.0, up: 15.0 }
      pilot: { type: goto, speed: 4.0 }
      subject: { x: 20.0, y: 0.0, class: pedestrian }
    policy: { path: policies/sitl_pedestrian.yaml }
    # 50 s (2026-11-02, docs/RUBRIC-failsafe.md section 3): long enough to
    # show the fail-safe outcome. Shorter, the run ended while the FSM held
    # in Loiter with its 30 s operator timeout still running, or while the
    # planner's unsafe request (rubric E5) was still running - and the
    # cell scored as a correct non-trigger it had not shown.
    ticks: 500   # was the library default, 300
    shield: true
    expected_kpis:
      p0_violation_escape_rate: { max: 0.0 }
      min_range_to_subject: { min: 9.99 }
      reached_goal: { equals: true }
    expected_outcome: RTL_triggered   # was success: the fail-safe it expects (E5) ends in RTL
    # Fail-safe label by the rubric (docs/RUBRIC-failsafe.md, 2026-11-02): E5 - flown without a fail-safe, the pilot asks through the subject's ring for the whole 49.9 s, a repair over theta (>= 30.1 s). Was: false.
    expected_failsafe: true
    failsafe_clause: E5

  # ---- the old library's rule types, at many geometries ------------------- #
  - scenario_id: standoff-approach-angles
    template: subject_standoff
    description: >
      standoff-approach from drawn directions, with the declared subject 7, 9
      or 12 m off the route as a pedestrian (10 m ring) or a car (5 m ring). At
      7 and 9 m the pedestrian ring crosses the route and the Shield has to
      take the aircraft round it; the car ring never does. Either way the
      binding ring must hold and the mission must finish.

      9 m with a pedestrian was a known failure from 2026-10-07 to
      2026-10-12: a false fail-safe through theta and the Loiter timeout
      (the first StandoffHold moved the forecast 2.1 m, over the 2.0 m
      lateral theta, so the FSM abandoned projection, X1 then G3; LOITER
      held, the pilot kept asking, and the 30 s timeout, G5, sent the
      aircraft home; never unsafe, P0 clean). On the shipped default it now
      passes in the library and on all three nightly variants and seeds,
      on either theta reading; with the onset limit at 0 s it fails again
      (measured 2026-10-11 and 2026-10-12). Its pin was removed on
      2026-10-12. The onset limit is the PI's question 11 and theta's
      reading question 1 (docs/DESIGN-escalation-fsm.md, Questions for the
      PI): if the PI's answers bring the failure back, so does the pin.
    mission:
      start_pose: { x: 0.0, y: 0.0, up: 15.0 }
      target: { x: 40.0, y: 0.0, up: 15.0 }
      pilot: { type: goto, speed: 4.0 }
      subject: { x: 20.0, y: "$offset_m", class: "$subject_class" }
      rotate_deg: "$approach_deg"
    policy: { path: policies/sitl_pedestrian.yaml }
    ticks: 400
    parameter_sweep:
      offset_m: [7, 9, 12]
      subject_class: [pedestrian, car]
    parameter_sample:
      approach_deg: { uniform: [0, 360] }
    expected_kpis:
      P0_escape_rate: 0
      time_to_safe_episodes: { max: 0 }
      breaches: { max: 0 }
      reached_goal: { equals: true }
    expected_outcome: success
    expected_failsafe: false
    failsafe_clause: N1
    # ADOPTED 2026-11-10 (docs/RUBRIC-failsafe.md section 7; the user's
    # decision of 9-10 November, taken after the rig had shown the
    # autopilot's lag on 7 November - not a pre-registered reading): E5 read on the
    # flight the grant prescribes gives the 7 m pedestrian cell its own label.
    failsafe_cells:
      - params: { offset_m: 7, subject_class: pedestrian }
        expected_failsafe: true
        clause: E5
        expected_outcome: RTL_triggered
        why: >
          E5 on the prescribed flight (section 7, adopted 2026-11-10): the pedestrian's 10 m ring crosses the route and the first forecast that meets it is more than theta deep; projection abandoned and the aircraft held, as the grant prescribes, the request stays over theta for 39.9 s (>= 30.1 s), every variant. On section 3's reading (the flight without a fail-safe: the projection takes the aircraft round the ring in 1.5 s of unsafe requests) this cell is N1
    # `fails` measured 2026-10-19 over the nightly profile's 9 pinned
    # episodes (f93283d): goal, outcome and fail-safe label. Since the
    # adoption of section 7 (2026-11-10) the outcome and the label are what
    # the cell expects (RTL by the operator timeout); only the family's goal
    # gate, which has no per-cell form, stays pinned.
    known_failures:
      - params: { offset_m: 7, subject_class: pedestrian }
        fails: [reached_goal]
        description: >
          The fail-safe E5 expects on the prescribed flight (docs/RUBRIC-
          failsafe.md section 7, adopted 2026-11-10) ends the mission: the FSM
          abandons projection on tick 0 (X1, then G3: Loiter), the autopilot
          holds the aircraft where the deep request stays deep, and the
          operator's 30 s timeout (G5) sends it home, so the goal the family
          gates on is not reached. On section 3's reading this cell was a
          false fail-safe (N1), pinned on the goal, the outcome and the label.
          Never unsafe, P0 clean.
