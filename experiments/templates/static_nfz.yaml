# Scenario library - template `static_nfz`: a fixed keep-out zone (policy polygon_fence), flown at directly.
# An extension template (guardrail/scenario_spec.py, EXTENSION_TEMPLATES).
#
# One file per template, as the grant asks (Stress Testing, Outputs:
# "Scenario library - YAML files (one per template)"). Listed by
# experiments/scenarios.yaml and validated at load by
# guardrail/scenario_spec.py (ScenarioSpec); a family here must carry this
# file's template. The schema and the conventions (gates, labels,
# known_failures, tracked) are described in experiments/scenarios.yaml.

template: static_nfz

scenarios:
  # ---- no-fly zone: the canonical pair ---------------------------------- #
  - scenario_id: nfz-head-on
    template: static_nfz
    description: "Flown straight at a no-fly zone. The Shield must never let it in."
    mission:
      start_pose: { x: -20.0, y: 15.0, up: 15.0 }
      target: { x: 40.0, y: 15.0, up: 15.0 }
      pilot: { type: goto, speed: 4.0 }
    policy: { path: policies/sim_demo_policy.yaml }
    shield: true
    # Arms (2026-10-07): the rule summary in front of the pilot on and off on
    # the same seed, and its compile_csp text in two paraphrased wordings
    # beside the canonical one. The headless pilot reads neither, so every arm
    # must fly the same flight; the sweep checks that it does.
    ab: true
    paraphrase: { k: 2, backend: stored, source: csp }
    expected_kpis:
      p0_violation_escape_rate: { max: 0.0 }
      time_to_safe_episodes: { max: 0 }
    expected_failsafe: false
    failsafe_clause: N1
    # No outcome label: the dumb pilot aims through the zone and the Shield
    # holds it at the edge (final x = -5.6, goal never reached). That is the
    # same "repaired action, no sensible trajectory" gap as standoff-wedge; this
    # scenario's claim is containment, not completion.

  - scenario_id: nfz-head-on-control
    template: static_nfz
    description: >
      The same flight unshielded. This scenario must FAIL its safety gate to be
      doing its job: if an unguarded run into a no-fly zone scores clean, the
      harness is measuring nothing and every other pass here is worthless.
    mission:
      start_pose: { x: -20.0, y: 15.0, up: 15.0 }
      target: { x: 40.0, y: 15.0, up: 15.0 }
      pilot: { type: goto, speed: 4.0 }
    policy: { path: policies/sim_demo_policy.yaml }
    shield: false
    expected_kpis:
      p0_violation_escape_rate: { min: 0.01 }
      time_to_safe_episodes: { min: 1 }
    expected_outcome: fail

  # ---- the SITL rail's own mission, headless (2026-10-07) ----------------- #
  - scenario_id: rail-mission-stub-vla
    template: static_nfz
    # ADOPTED 2026-11-10 (docs/RUBRIC-failsafe.md section 7; the user's
    # decision of 9-10 November, taken after the rig had shown the
    # autopilot's lag on 7 November - not a pre-registered reading): E5 read on the
    # flight the grant prescribes. The stub's first command from the pad sends the
    # 5 s forecast 8.1 m into nfz-square's margin ring, over theta on the
    # decided basis; projection abandoned, the aircraft held at the pad, the
    # request stays over theta for the whole 49.9 s (E5), so the FSM's
    # X1 -> G3 -> G5 is the fail-safe this label expects. On section 3's
    # reading (E5 on the flight without a fail-safe, where the projection
    # takes the stub round the zone in 10.9 s of unsafe requests) it is N1,
    # and until the adoption this cell was pinned as a false fail-safe
    # (`expect: known_failure`, `known_failure_fails: [failsafe]`). That
    # reading is still printed (docs/data/failsafe_labels_rail.json, "a").
    description: >
      The mission the ArduPilot SITL + MAVROS 2 rail flies
      (sitl/ros2_shield_node.py: "fly to the northeast pad at 6 m/s", StubVLA
      from the pad at 15 m), headless: the straight line from (0, 0) to
      (30, 30) runs through the demo no-fly zone's diagonal. The same pilot law
      on both backends (`stub_vla`), so this is the one library scenario
      `--backend sitl` can fly under its own id. The Shield must hold it out.
    mission:
      start_pose: { x: 0.0, y: 0.0, up: 15.0 }
      target: { x: 30.0, y: 30.0, up: 15.0 }
      pilot: { type: stub_vla, speed: 6.0 }
    policy: { path: policies/sim_demo_policy.yaml }
    # 50 s (2026-11-02, docs/RUBRIC-failsafe.md section 3): long enough to
    # show the fail-safe outcome. Shorter, the run ended while the FSM held
    # in Loiter with its 30 s operator timeout still running, or while the
    # planner's unsafe request (rubric E5) was still running - and the
    # cell scored as a correct non-trigger it had not shown.
    ticks: 500   # was the library default, 300
    expected_kpis:
      P0_escape_rate: 0
      time_to_safe_episodes: { max: 0 }
      breaches: { max: 0 }
      polygon_entries: { max: 0 }
    # Rubric (docs/RUBRIC-failsafe.md): E5 on the prescribed flight (section 7, adopted 2026-11-10) - held as the grant prescribes, the request stays over theta for 49.9 s (>= 30.1 s). On section 3's reading N1 - flown without a fail-safe, the projection takes the stub round the zone: its requests are over theta for 10.9 s, then repairable. Was: false (N1).
    expected_failsafe: true
    failsafe_clause: E5

  # ---- the grant's mid-term demo gate, on the functional rail (ARCH-16) - #
  # Flown by experiments/profiles/gazebo_midterm.yaml alone (`profiles`):
  # the library run, smoke, nightly and broad leave it out, so it moves no
  # published number.
  - scenario_id: midterm-demo-graze
    template: static_nfz
    profiles: [gazebo_midterm]
    description: >
      The grant's mid-term demo gate (05-recommendation/recommendation.md,
      "Mid-term (2026-07-20) demo gate"): a signed bundle with one polygon
      NFZ and one envelope rule, a natural-language task that wants to enter
      the NFZ, the Shield intercepting and applying lateral projection, and
      the audit's policy_hash matching the bundle. rail-mission-stub-vla
      flies the rail's own task through the zone's diagonal; its first
      forecast is 8.1 m deep, over theta, so the projection is abandoned and
      the FSM escalates (E5). Here the straight line from the start to the
      pad cuts the zone's south-east corner shallowly (about 1.5 m into the
      margin ring, under theta 2.0 m), so the projection is applied and
      flown and the pilot is slid round the corner to the pad. The pilot is
      the rails' StubVLA: it reads no text. The rail's Shield node parses
      its own mission text (SITL_RAIL_COMMAND, the same words) and the
      scenario's --target moves the pad to (45, 12).
    mission:
      task_prompt: "fly to the northeast pad at 6 m/s"
      start_pose: { x: 0.0, y: 3.0, up: 15.0 }
      target: { x: 45.0, y: 12.0, up: 15.0 }
      pilot: { type: stub_vla, speed: 6.0 }
    # The signed bundle of policies/sim_demo_policy.yaml (tools/build_flight_bundles.py;
    # bundles/ is not committed): the rail's Shield node verifies its
    # signature and pins this hash (the gate's step 1). Build it before flying.
    policy:
      bundle_path: bundles/fase3-sim-demo-v0.1.4.tar.gz
      expected_hash: "sha256:b665adbaac29186240d5a74a8fa36a94b69adae2db6035ca69d45c8e93e7f358"
    ticks: 500
    expected_kpis:
      P0_escape_rate: 0
      time_to_safe_episodes: { max: 0 }
      breaches: { max: 0 }
      polygon_entries: { max: 0 }
    expected_outcome: success
    expected_failsafe: false
    failsafe_clause: N1

  # ---- MSL over a declared ground (X-11, 2026-11-18, wf21) ------------- #
  # Flown by experiments/profiles/msl_dem.yaml alone (`profiles`): the
  # library run, smoke, nightly and broad leave it out, so it moves no
  # published number. Its labels are the rubric's (tools/failsafe_rubric.py
  # --profile msl_dem), read on the adopted reading (rail vehicle,
  # prescribed flight).
  - scenario_id: msl-dem-zone-ridge
    template: static_nfz
    profiles: [msl_dem]
    ground: experiments/worlds/dem_cmac_wgs84.json
    description: >
      An MSL keep-out over the declared ground's ridge
      (experiments/policies/msl_dem_zone.yaml: msl-ridge-nfz, a polygon_fence
      with altitude_ref MSL, 606-700 m MSL, 60-140 m east of home and 30 m
      either side of the home's meridian; agl-band 8-60 m above the ground;
      the DEM experiments/worlds/dem_cmac_wgs84.json, crest 602.75 m MSL at
      100 m east). A goto pilot flies at 3 m/s from 15 m above the start's
      ground at x = -45 to a pad 200 m east. target_x -45 flies straight
      east, 13 m beside the zone's margin ring, crossing the ridge over the
      AGL floor. target_x -20 flies a diagonal whose straight line cuts the
      ring's south-west corner over the crest (2.5 m into the footprint at
      140 m east), where the AGL floor needs at least 610.75 m MSL, inside
      the zone's band: no height there is legal, so the Shield must take
      the aircraft round the corner. The gates are the requirement: no P0
      escape, no breach, no polygon entry, the target reached, the flight
      ended safe. Read as AGL the same zone would sit 606 m above the ground
      and never bind; this family exists to fly an MSL polygon_fence over a
      varying ground on the sitl / hil rails (the harness names the ground
      to the nodes, rail_node_args). Not swept: a lane into the footprint's
      middle (x = 0). Measured headless on 2026-11-18 (seed 1001) the goto
      pilot is then held by Brake 43 m east for the rest of the flight on
      the ideal vehicle (rubric N1, the target missed) and by Brake, Loiter
      and RTL on the rig's fitted response (rubric E5): a cell whose label
      flips with the vehicle, which this family is not.
    mission:
      task_prompt: "fly east over the ridge to the far pad"
      start_pose: { x: -45.0, y: 0.0, up: 15.0 }
      target: { x: "$target_x", y: 200.0, up: 15.0 }
      pilot: { type: goto, speed: 3.0 }
    policy: { path: experiments/policies/msl_dem_zone.yaml }
    parameter_sweep:
      target_x: [-45.0, -20.0]
    ticks: 750
    expected_kpis:
      P0_escape_rate: 0
      breaches: { max: 0 }
      polygon_entries: { max: 0 }
      reached_goal: { equals: true }
      ended_safe: { equals: true }
    expected_outcome: success
    expected_failsafe: false
    failsafe_clause: N1
