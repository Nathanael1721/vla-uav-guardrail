# Scenario library - template `three_simultaneous_violations`: Safety Shield test matrix: three simultaneous violations.
# An extension template (guardrail/scenario_spec.py, EXTENSION_TEMPLATES).
#
# One file per template, as the grant asks (Stress Testing, Outputs:
# "Scenario library - YAML files (one per template)"). Listed by
# experiments/scenarios.yaml and validated at load by
# guardrail/scenario_spec.py (ScenarioSpec); a family here must carry this
# file's template. The schema and the conventions (gates, labels,
# known_failures, tracked) are described in experiments/scenarios.yaml.

template: three_simultaneous_violations

scenarios:
  # ---- Shield matrix: "Three simultaneous violations" -------------------- #
  - scenario_id: three-simultaneous-violations
    template: three_simultaneous_violations
    expect: known_failure
    # What the family fails, re-measured 2026-10-20 at 400 ticks over the
    # library (6 cells, both forecast arms), the smoke cell and all 54
    # nightly episodes: the two labels, nothing else - the false fail-safe
    # now comes from the Loiter timeout (G5), see the description. P0,
    # finite actions, the single climb-out, the breach count and the safe end
    # stay gated. (The marker came off on 2026-10-19, when every cell passed
    # at 300 ticks; that pass held only because the 30 s run ended 0.2 s
    # before G5. Review of T1c, P1.)
    known_failure_fails: [outcome, failsafe]
    # 40 s, past the operator-defined Loiter timeout (G5, 30 s, ours), so the
    # labels are judged on what the FSM does next and not on where the run
    # happens to stop. The library default (300 ticks) ended these episodes
    # IN Loiter at 29.9 s; at 302 ticks they went X1 G3 G5, at 400 X1 G3 G5
    # G9 (home reached at 31.9 s, both arms).
    ticks: 400
    description: >
      tests/test_guardrail_coverage.py's unit case, flown: below the 10 m floor,
      asking 8-11 m/s against a 4 m/s cap, descending at 3 m/s, and pointed at
      the no-fly zone 4 m away - from a drawn approach angle. Repair operators
      have to interact without oscillating (bounded iteration); the aircraft
      must climb out exactly once and never enter the zone.
      KNOWN FAILURE IN EVERY CELL since the escalation FSM was wired into the
      Shield (2026-10-07): a FALSE fail-safe. The first repair's AltitudeFix
      is 12-18 m at the grant's 5 s forecast (8-14 m at 3 s) against the
      grant's 0.5 m vertical theta, so the FSM abandons projection at once
      (X1 then G3: Brake -> Loiter).
      Until 2026-10-19 ArduPilot's LOITER held the aircraft where it was,
      below the floor (48 P0 ticks of LOITER), and five seconds of an illegal
      position later X6 sent it home (X1 G3 X6 G9, 9.6 s). Since then the
      FSM's hold point is chosen legally (guardrail/holdpoint.py): a stop
      below the floor is illegal at every horizontal position, so the hold
      is moved straight up to 10.5 m, 0.5 m inside the band, the modelled
      autopilot climbs there at 2 m/s, and X6 no longer fires (the illegal
      depth falls at the climb rate). That part is robust. The labels are
      not: the pilot keeps asking for the illegal action, so the Loiter
      never clears (G8), and 30 s after G3 the operator-defined Loiter
      timeout (G5, ours) sends the aircraft home: X1 G3 G5 G9, RTL at
      30.1 s, home at 31.9 s, the zone never entered, the episode ends safe
      and P0 clean - a fail-safe the label does not expect. At the library's
      default 300 ticks the run ended in Loiter 0.2 s before G5 and the cell
      read as a pass (2026-10-19); this family now flies 400 ticks so that
      pass cannot come back by accident. Whether a pilot that asks for an
      illegal action for 30 s SHOULD be sent home - the label, or our 30 s
      timeout - is a question for the PI (docs/DESIGN-hold-points.md).
      The variant-2 forecast-tunnelling record (2026-10-06) is kept below as
      a comment.
    mission:
      start_pose: { x: 2.0, y: 15.0, up: "$start_up" }
      pilot: { type: constant, action: { vx: "$ask_mps", vz_up: -3.0 } }
      rotate_deg: "$approach_deg"
      rotate_about: { x: 15.0, y: 15.0 }
    policy: { path: policies/sim_demo_policy.yaml }
    parameter_sweep:
      start_up: [3.0, 6.0, 9.0]
      ask_mps: [8, 11]
    parameter_sample:
      approach_deg: { uniform: [0, 360] }
    expected_kpis:
      P0_escape_rate: 0
      all_actions_finite: { equals: true }
      time_to_safe_episodes: { equals: 1 }
      time_to_safe_censored: { max: 0 }
      breaches: { max: 0 }
      ended_safe: { equals: true }
    expected_outcome: success
    expected_failsafe: false
    # The 2026-10-06 cell pin, removed 2026-10-19 with the family marker (its
    # 18 nightly episodes passed every gate at 300 ticks). The family marker
    # is back since 2026-10-20 (G5, above); this pin is not: the tunnelling
    # it records is gone at the grant's forecast, so it would pin nothing the
    # family marker does not. It read, `params: {variant: 2}, fails:
    # [outcome, failsafe]`:
    #   Forecast tunnelling (measured 2026-10-06). From approach variant 2 the
    #   aircraft climbs out and slides round the zone's (23, 23) corner. At
    #   t = 6.8 s it is 1.016 m from the corner (outside the 1 m ring) and the
    #   emitted action (-2.89, 2.77) m/s enters the ring 0.05-0.10 s later;
    #   the Shield's forecast samples t+0 and t+0.5 s only (dt = 0.5, the
    #   value every rail passes), both outside, so the clip is never seen and
    #   the aircraft enters the ring by 0.02 m. The grant asks whether the
    #   predicted SEGMENT crosses the boundary (Safety Shield p2), not
    #   whether sampled points land in it. Same in all six cells of this
    #   variant; the polygon itself is not entered. At the grant's forecast
    #   (5 s at 0.1 s, since 2026-10-12) it is gone: the poses are 0.1 s
    #   apart and the clip is seen, so with the FSM off the aircraft keeps
    #   1.18 m from the zone in all six cells (0.98 m at 3 s / 0.5 s).
