# Scenario library - template `altitude_envelope`: the floor / ceiling of the altitude band.
# An extension template (guardrail/scenario_spec.py, EXTENSION_TEMPLATES).
#
# One file per template, as the grant asks (Stress Testing, Outputs:
# "Scenario library - YAML files (one per template)"). Listed by
# experiments/scenarios.yaml and validated at load by
# guardrail/scenario_spec.py (ScenarioSpec); a family here must carry this
# file's template. The schema and the conventions (gates, labels,
# known_failures, tracked) are described in experiments/scenarios.yaml.

template: altitude_envelope

scenarios:
  # ---- altitude --------------------------------------------------------- #
  - scenario_id: altitude-floor-recovery
    template: altitude_envelope
    description: >
      Starts below the floor. Recovery must climb, not freeze.
      Was a KNOWN FAILURE from 2026-10-07 to 2026-10-09: a FALSE fail-safe
      through edge X6. The recovery climbs from 3 m and converges
      (AltitudeFix sizes the climb to reach the band in one lookahead, so it
      slows near the floor), but the position had then been illegal for
      T = 5 s with the Shield still intervening, and X6, which tested
      duration only, sent the aircraft to RTL at 9.45 m, 0.55 m short of the
      floor. The grant's fail-safe is for a repair that is unsafe ("trigger
      fail-safe (RTL / Land) when repair is unsafe", Safety Shield p1), and
      this one was working. Since 2026-10-09 X6 leaves a recovery alone while
      its illegal depth is shown to fall (guardrail/fsm.py,
      x6_min_escape_mps): the flight takes G1 then G7, reaches the band at
      6.3 s and completes. Re-measured 2026-10-11 on both theta readings and
      with the onset limit at 1 s and 0 s; the marker was removed then. With
      the FSM off the flight is the LEGACY one (tests/test_sweep.py).
      At the grant's 5 s forecast (2026-10-12) it reaches the band at 10.3 s
      (G1 at 0 s, G7 at 12.3 s): AltitudeFix sizes the climb to arrive in one
      LOOKAHEAD, so a longer lookahead climbs more gently (see
      altitude-recovery-depth for the arithmetic). Still one recovery, no
      fail-safe, and the purpose holds.
    mission:
      start_pose: { x: -30.0, y: -30.0, up: 3.0 }
      pilot: { type: constant, action: { vx: 3.0 } }
    policy: { path: policies/sim_demo_policy.yaml }
    shield: true
    expected_kpis:
      p0_violation_escape_rate: { max: 0.0 }
      ended_safe: { equals: true }
    expected_outcome: success
    expected_failsafe: false

  - scenario_id: altitude-ceiling-hold
    template: altitude_envelope
    description: "Commanded to climb through the ceiling for the whole flight."
    mission:
      start_pose: { x: -30.0, y: -30.0, up: 18.0 }
      pilot: { type: constant, action: { vx: 2.0, vz_up: 2.0 } }
    policy: { path: policies/sim_demo_policy.yaml }
    shield: true
    expected_kpis:
      p0_violation_escape_rate: { max: 0.0 }
      ended_safe: { equals: true }
    expected_outcome: success
    expected_failsafe: false

  - scenario_id: altitude-recovery-depth
    template: altitude_envelope
    description: >
      altitude-floor-recovery from seven more depths: 0.5-9.5 m against the
      10 m floor and 20.5-30 m against the 20 m ceiling. One recovery each,
      never censored, and no slower than the Shield's own recovery law
      allows. AltitudeFix aims 1 m inside the band (the re-entry margin) and
      sizes the climb to get there in one lookahead L, capped at the policy's
      2 m/s: from D metres short of that aim it climbs at the cap until
      D = 2 L, then follows D(t) = D1 exp(-t / L) and crosses the band edge
      when D = 1 m. Time to safe = max(0, D0 - 2 L) / 2 + L ln(min(D0, 2 L)).
      At the grant's L = 5 s (2026-10-12) that is 12.0 s from the deepest
      cell (30 m, D0 = 11 m) and measured 11.9 s; the gate is 12.1 s, one tick
      above. THE GATE IS IMPLEMENTATION-DERIVED: it certifies that the
      recovery follows AltitudeFix's own law, not that it meets a
      requirement. The grant sets no target for mean time to safe (Safety
      Shield, KPI table: "tracked"); its one figure, `mean_time_to_safe_s:
      "<=2.0"` in Stress Testing's example ScenarioSpec, belongs to a
      dynamic-NFZ sweep, and against it these recoveries (10.9-11.9 s at 5 s,
      6.8-7.8 s at 3 s) would all fail. Until 2026-10-12 the harness flew
      L = 3 s and the gate read "the
      depth at the cap plus one 3 s lookahead (8 s at the deepest)", which
      held with 0.2 s to spare (7.6, 6.8, 7.8 s); at 5 s those three cells
      take 11.7, 10.9 and 11.9 s and failed it. The finding: at the grant's
      forecast a recovery from below the floor is about 1.5 times slower,
      because the climb is sized to the lookahead, not to the cap. 3 m is not
      swept: that is
      altitude-floor-recovery's own flight, and the sweep refuses to count one
      flight as two scenarios. 0.5, 2 and 30 m were known failures from
      2026-10-07 to 2026-10-09 (X6 sent a converging recovery to RTL after
      5 s illegal; see altitude-floor-recovery). Since X6's progress test
      (2026-10-09) they take G1 then G7 and recover in 7.6, 6.8 and 7.8 s;
      re-measured 2026-10-11 on both theta readings and both onset limits,
      and their markers were removed then. Still open from the 30 m cell:
      ArduPilot's RTL entered above RTL_ALT (15 m) returns at its current
      altitude, so an RTL from above the 20 m ceiling would reach home
      still above it; whether a ceiling breach should make RTL descend
      first is a design question the grant does not answer. Since
      2026-10-12 guardrail/rtl_path.py reports such a leg as blocked (its
      return altitude is outside the band), so an RTL from there takes G6
      and lands; no cell here reaches RTL, so it is not exercised here.
    mission:
      start_pose: { x: -30.0, y: -30.0, up: "$start_up" }
      pilot: { type: constant, action: { vx: 3.0 } }
    policy: { path: policies/sim_demo_policy.yaml }
    parameter_sweep:
      start_up: [0.5, 2.0, 6.0, 9.5, 20.5, 24.0, 30.0]
    expected_kpis:
      P0_escape_rate: 0
      ended_safe: { equals: true }
      time_to_safe_episodes: { equals: 1 }
      time_to_safe_censored: { max: 0 }
      # The recovery law's bound at L = 5 s (description); 8.0 at L = 3 s.
      # Implementation-derived: the grant sets no time-to-safe target.
      mean_time_to_safe_s: "<=12.1"
    expected_outcome: success
    expected_failsafe: false
